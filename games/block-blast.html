<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blast - SkyWorld</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .bb-layout { display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px; width:100%; max-width:520px; margin:0 auto; }
    .bb-hud { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
    .bb-stat { font-family:'Fredoka One',cursive; font-size:10px; color:rgba(255,255,255,0.65); text-align:center; }
    .bb-stat span { display:block; font-size:22px; color:#ffd54f; text-shadow:0 2px 8px rgba(255,213,79,0.4); }
    #bb-board { display:grid; gap:2px; background:rgba(255,255,255,0.08); padding:6px; border-radius:12px; border:2px solid rgba(255,255,255,0.2); touch-action:none; user-select:none; }
    .bb-cell { width:var(--cell); height:var(--cell); border-radius:4px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); transition:background 0.1s; box-sizing:border-box; }
    .bb-cell.filled { border:1px solid rgba(0,0,0,0.2); }
    .bb-cell.preview-ok { opacity:0.7; }
    .bb-cell.preview-bad { background:#ef5350 !important; opacity:0.6; }
    .bb-cell.clearing { animation:bbClear 0.35s ease forwards; }
    @keyframes bbClear { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.2);opacity:0.8} 100%{transform:scale(0);opacity:0} }
    .bb-tray { display:flex; gap:10px; justify-content:center; align-items:flex-end; min-height:90px; flex-wrap:wrap; }
    .bb-piece-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:grab; touch-action:none; user-select:none; padding:6px; border-radius:10px; border:2px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.10); transition:all 0.15s; }
    .bb-piece-wrap.selected { border-color:rgba(255,255,255,0.75); background:rgba(255,255,255,0.22); transform:scale(1.06); }
    .bb-piece-wrap.used { opacity:0.2; pointer-events:none; }
    .bb-piece-wrap:hover:not(.used) { border-color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.18); }
    .bb-piece-grid { display:grid; gap:2px; }
    .bb-piece-cell { border-radius:3px; }
    .bb-ghost { position:fixed; pointer-events:none; z-index:9999; opacity:0.85; transform:translate(-50%,-50%); }
    .bb-hint { font-family:'Fredoka One',cursive; font-size:9px; color:rgba(255,255,255,0.5); text-align:center; letter-spacing:1px; }
    .bb-combo { font-family:'Fredoka One',cursive; font-size:14px; color:#ffd54f; text-align:center; animation:popIn 0.4s ease; height:24px; }
    @keyframes popIn { 0%{transform:scale(0.5);opacity:0} 70%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
  </style>
</head>
<body data-game="block-blast">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">💥 BLOCK BLAST</span>
    <span class="score-display">BEST: <span id="nav-best">0</span></span>
  </nav>

  <!-- START -->
  <div id="screen-start" class="game-screen" style="max-width:440px;margin:30px auto;text-align:center;">
    <h1>💥 BLOCK BLAST</h1>
    <p style="line-height:1.7;color:rgba(255,255,255,0.8);">
      Drag pieces onto the 8×8 board.<br>
      Fill complete rows or columns to blast them!<br>
      Place all 3 pieces to get a new batch.<br>
      Game ends when no piece can be placed.
    </p>
    <div style="margin:20px 0;">
      <span style="font-family:'Fredoka One',cursive;font-size:28px;color:#ffd54f;" id="best-start">0</span><br>
      <span style="font-family:'Fredoka One',cursive;font-size:8px;color:rgba(255,255,255,0.5);">BEST SCORE</span>
    </div>
    <button class="pixel-btn btn-cyan" onclick="BB.start()" style="width:100%;max-width:260px;"><span class="btn-span">▶ PLAY</span></button>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="game-screen hidden">
    <div class="bb-layout">
      <div class="bb-hud">
        <div class="bb-stat"><span id="bb-score">0</span>SCORE</div>
        <div class="bb-stat"><span id="bb-best">0</span>BEST</div>
        <div class="bb-stat"><span id="bb-lines">0</span>LINES</div>
      </div>
      <div class="bb-combo" id="bb-combo"></div>
      <div id="bb-board"></div>
      <div class="bb-tray" id="bb-tray"></div>
      <div class="bb-hint" id="bb-hint">DRAG A PIECE ONTO THE BOARD</div>
    </div>
  </div>

  <!-- END -->
  <div id="screen-end" class="game-screen hidden" style="max-width:400px;margin:40px auto;text-align:center;">
    <h2 style="font-family:'Fredoka One',cursive;font-size:18px;color:#ef9a9a;margin-bottom:16px;">NO MOVES LEFT!</h2>
    <div style="display:flex;gap:24px;justify-content:center;margin-bottom:24px;">
      <div><span style="font-family:'Fredoka One',cursive;font-size:28px;color:#ffd54f;display:block;" id="end-score">0</span><span style="font-family:'Fredoka One',cursive;font-size:7px;color:rgba(255,255,255,0.5);">SCORE</span></div>
      <div><span style="font-family:'Fredoka One',cursive;font-size:28px;color:#a5d6a7;display:block;" id="end-best">0</span><span style="font-family:'Fredoka One',cursive;font-size:7px;color:rgba(255,255,255,0.5);">BEST</span></div>
      <div><span style="font-family:'Fredoka One',cursive;font-size:28px;color:#81d4fa;display:block;" id="end-lines">0</span><span style="font-family:'Fredoka One',cursive;font-size:7px;color:rgba(255,255,255,0.5);">LINES</span></div>
    </div>
    <p id="end-msg" style="font-family:'Nunito',sans-serif;color:rgba(255,255,255,0.7);margin-bottom:20px;"></p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="pixel-btn btn-cyan" onclick="BB.start()" style="min-width:140px;"><span class="btn-span">▶ PLAY AGAIN</span></button>
      <button class="pixel-btn" onclick="showScreen('screen-start')" style="min-width:100px;"><span class="btn-span">MENU</span></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>
<script>
// ─── helpers ─────────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.game-screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ─── Block Blast ─────────────────────────────────────────────────────────────
const BB = (function(){
  'use strict';

  const GRID = 8;
  const CELL_PX = Math.min(Math.floor((Math.min(window.innerWidth, 480) - 60) / GRID), 44);

  // Colour palette (SkyWorld theme)
  const COLORS = ['#29b6f6','#66bb6a','#ffd54f','#ef5350','#ab47bc','#ff9800','#26c6da','#ec407a','#8bc34a','#5c6bc0'];

  // ── Piece definitions (all valid Block Blast shapes) ──────────────────────
  // Each shape is an array of [row, col] offsets from top-left
  const PIECES = [
    // 1-cell
    { cells:[[0,0]], size:1 },
    // 2-cell
    { cells:[[0,0],[0,1]], size:2 },
    { cells:[[0,0],[1,0]], size:2 },
    // 3-cell line
    { cells:[[0,0],[0,1],[0,2]], size:3 },
    { cells:[[0,0],[1,0],[2,0]], size:3 },
    // 3-cell L
    { cells:[[0,0],[1,0],[1,1]], size:3 },
    { cells:[[0,0],[0,1],[1,0]], size:3 },
    { cells:[[0,0],[0,1],[1,1]], size:3 },
    { cells:[[1,0],[1,1],[0,1]], size:3 },
    // 2×2 square
    { cells:[[0,0],[0,1],[1,0],[1,1]], size:4 },
    // 4-cell line
    { cells:[[0,0],[0,1],[0,2],[0,3]], size:4 },
    { cells:[[0,0],[1,0],[2,0],[3,0]], size:4 },
    // 5-cell line
    { cells:[[0,0],[0,1],[0,2],[0,3],[0,4]], size:5 },
    { cells:[[0,0],[1,0],[2,0],[3,0],[4,0]], size:5 },
    // 2×3 rect
    { cells:[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]], size:6 },
    { cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], size:6 },
    // 3×3 square
    { cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], size:9 },
    // L-shapes 4-cell
    { cells:[[0,0],[1,0],[2,0],[2,1]], size:4 },
    { cells:[[0,0],[1,0],[2,0],[0,1]], size:4 },
    { cells:[[0,0],[0,1],[0,2],[1,0]], size:4 },
    { cells:[[0,0],[0,1],[0,2],[1,2]], size:4 },
    { cells:[[0,1],[1,1],[2,0],[2,1]], size:4 },
    { cells:[[0,0],[0,1],[1,1],[2,1]], size:4 },
    // S/Z shapes
    { cells:[[0,1],[0,2],[1,0],[1,1]], size:4 },
    { cells:[[0,0],[0,1],[1,1],[1,2]], size:4 },
    { cells:[[0,0],[1,0],[1,1],[2,1]], size:4 },
    { cells:[[0,1],[1,0],[1,1],[2,0]], size:4 },
    // T shapes
    { cells:[[0,0],[0,1],[0,2],[1,1]], size:4 },
    { cells:[[0,1],[1,0],[1,1],[2,1]], size:4 },
    { cells:[[1,0],[1,1],[1,2],[0,1]], size:4 },
    { cells:[[0,0],[1,0],[1,1],[2,0]], size:4 },
  ];

  // Weighted random piece (prefer smaller pieces for fairness)
  function randomPiece(){
    const weights = PIECES.map(p => Math.max(1, 10 - p.size));
    const total = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<PIECES.length;i++){
      r-=weights[i]; if(r<=0){ return { ...PIECES[i], color: COLORS[Math.floor(Math.random()*COLORS.length)] }; }
    }
    return { ...PIECES[0], color: COLORS[0] };
  }

  let grid, score, bestScore, totalLines, tray, selectedIdx, comboTimer;

  function makeGrid(){ return Array.from({length:GRID},()=>Array(GRID).fill(null)); }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function renderBoard(){
    const board = document.getElementById('bb-board');
    board.style.setProperty('--cell', CELL_PX+'px');
    board.style.gridTemplateColumns = `repeat(${GRID}, ${CELL_PX}px)`;
    board.innerHTML = '';
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
      const cell = document.createElement('div');
      cell.className = 'bb-cell';
      cell.dataset.r = r; cell.dataset.c = c;
      if(grid[r][c]){
        cell.classList.add('filled');
        cell.style.background = grid[r][c];
        cell.style.boxShadow = `inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.2)`;
      }
      board.appendChild(cell);
    }
    setupBoardEvents();
  }

  function renderTray(){
    const trayEl = document.getElementById('bb-tray');
    trayEl.innerHTML = '';
    tray.forEach((piece, idx) => {
      if(!piece){ const ph=document.createElement('div'); ph.style.width='60px'; trayEl.appendChild(ph); return; }

      const rows = Math.max(...piece.cells.map(c=>c[0]))+1;
      const cols = Math.max(...piece.cells.map(c=>c[1]))+1;
      const S = Math.min(18, Math.floor(80/Math.max(rows,cols)));

      const wrap = document.createElement('div');
      wrap.className = 'bb-piece-wrap' + (idx===selectedIdx?' selected':'') + (piece.used?' used':'');
      wrap.dataset.idx = idx;

      const grid2 = document.createElement('div');
      grid2.className = 'bb-piece-grid';
      grid2.style.gridTemplateColumns = `repeat(${cols}, ${S}px)`;
      grid2.style.gap = '2px';

      for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
        const cell = document.createElement('div');
        cell.className = 'bb-piece-cell';
        cell.style.width = S+'px'; cell.style.height = S+'px';
        if(piece.cells.some(([pr,pc])=>pr===r&&pc===c)){
          cell.style.background = piece.color;
          cell.style.boxShadow = `inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.2)`;
        } else {
          cell.style.background = 'transparent';
        }
        grid2.appendChild(cell);
      }
      wrap.appendChild(grid2);

      // Click to select
      wrap.addEventListener('pointerdown', e => { e.preventDefault(); selectPiece(idx, e); });
      trayEl.appendChild(wrap);
    });
  }

  // ── Selection & ghost drag ─────────────────────────────────────────────────
  let ghost = null, dragActive = false, lastHoverR = -1, lastHoverC = -1;

  function selectPiece(idx, e){
    if(tray[idx]?.used) return;
    selectedIdx = (selectedIdx === idx) ? -1 : idx;
    clearPreview();
    renderTray();
    if(selectedIdx >= 0){
      document.getElementById('bb-hint').textContent = 'TAP A CELL ON THE BOARD TO PLACE';
      startGhostDrag(e);
    } else {
      document.getElementById('bb-hint').textContent = 'SELECT A PIECE FROM THE TRAY';
      removeGhost();
    }
  }

  function startGhostDrag(e){
    removeGhost();
    if(selectedIdx < 0 || !tray[selectedIdx]) return;
    const piece = tray[selectedIdx];
    const rows = Math.max(...piece.cells.map(c=>c[0]))+1;
    const cols = Math.max(...piece.cells.map(c=>c[1]))+1;
    const S = Math.min(20, Math.floor(CELL_PX*0.9));

    ghost = document.createElement('div');
    ghost.className = 'bb-ghost';
    ghost.style.display = 'grid';
    ghost.style.gridTemplateColumns = `repeat(${cols},${S}px)`;
    ghost.style.gap = '2px';
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const cell = document.createElement('div');
      cell.style.width = S+'px'; cell.style.height = S+'px'; cell.style.borderRadius = '3px';
      cell.style.background = piece.cells.some(([pr,pc])=>pr===r&&pc===c) ? piece.color : 'transparent';
      ghost.appendChild(cell);
    }
    document.body.appendChild(ghost);
    moveGhost(e?.clientX ?? 0, e?.clientY ?? 0);
    dragActive = true;
  }

  function moveGhost(x, y){
    if(!ghost) return;
    ghost.style.left = x+'px';
    ghost.style.top  = y+'px';
  }

  function removeGhost(){
    if(ghost){ ghost.remove(); ghost=null; }
    dragActive = false;
  }

  // ── Board pointer events ───────────────────────────────────────────────────
  function setupBoardEvents(){
    const board = document.getElementById('bb-board');

    board.addEventListener('pointermove', e => {
      if(selectedIdx < 0) return;
      moveGhost(e.clientX, e.clientY);
      const cell = e.target.closest('.bb-cell');
      if(!cell) return;
      const r = parseInt(cell.dataset.r), c = parseInt(cell.dataset.c);
      if(r===lastHoverR && c===lastHoverC) return;
      lastHoverR=r; lastHoverC=c;
      showPreview(r, c);
    });

    board.addEventListener('pointerup', e => {
      if(selectedIdx < 0) return;
      const cell = e.target.closest('.bb-cell');
      if(!cell){ clearPreview(); return; }
      const r = parseInt(cell.dataset.r), c = parseInt(cell.dataset.c);
      tryPlace(r, c);
    });

    board.addEventListener('pointerleave', () => { clearPreview(); lastHoverR=-1; lastHoverC=-1; });
  }

  // Global move/up for dragging outside board
  document.addEventListener('pointermove', e => { if(dragActive) moveGhost(e.clientX, e.clientY); });
  document.addEventListener('pointerup', e => {
    if(!dragActive || selectedIdx < 0) return;
    const board = document.getElementById('bb-board');
    const rect = board.getBoundingClientRect();
    const bx = e.clientX - rect.left - 6;
    const by = e.clientY - rect.top  - 6;
    const c = Math.floor(bx / (CELL_PX+2));
    const r = Math.floor(by / (CELL_PX+2));
    if(r>=0&&r<GRID&&c>=0&&c<GRID){ tryPlace(r,c); }
    else { clearPreview(); removeGhost(); }
  });

  // ── Preview & placement ────────────────────────────────────────────────────
  function showPreview(baseR, baseC){
    clearPreview();
    if(selectedIdx < 0 || !tray[selectedIdx]) return;
    const piece = tray[selectedIdx];
    const canPlace = checkCanPlace(piece, baseR, baseC);
    piece.cells.forEach(([dr,dc])=>{
      const r=baseR+dr, c=baseC+dc;
      const cell = getCellEl(r, c);
      if(cell){
        if(!grid[r][c]) cell.classList.add(canPlace ? 'preview-ok' : 'preview-bad');
        if(canPlace){ cell.style.background = piece.color; cell.style.opacity='0.65'; }
        if(!canPlace){ cell.style.background='#ef5350'; cell.style.opacity='0.5'; }
      }
    });
  }

  function clearPreview(){
    document.querySelectorAll('#bb-board .bb-cell').forEach(cell => {
      cell.classList.remove('preview-ok','preview-bad');
      const r=parseInt(cell.dataset.r), c=parseInt(cell.dataset.c);
      cell.style.opacity='';
      if(grid[r][c]){
        cell.style.background=grid[r][c];
        cell.style.boxShadow=`inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.2)`;
      } else {
        cell.style.background='';
        cell.style.boxShadow='';
      }
    });
  }

  function getCellEl(r,c){
    if(r<0||r>=GRID||c<0||c>=GRID) return null;
    return document.querySelector(`#bb-board .bb-cell[data-r="${r}"][data-c="${c}"]`);
  }

  function checkCanPlace(piece, baseR, baseC){
    return piece.cells.every(([dr,dc])=>{
      const r=baseR+dr, c=baseC+dc;
      return r>=0&&r<GRID&&c>=0&&c<GRID&&!grid[r][c];
    });
  }

  function tryPlace(baseR, baseC){
    if(selectedIdx<0||!tray[selectedIdx]) return;
    const piece = tray[selectedIdx];
    if(!checkCanPlace(piece, baseR, baseC)){
      clearPreview(); removeGhost();
      PH.playBeep&&PH.playBeep(200,0.1,'sawtooth',0.06);
      return;
    }
    // Place
    piece.cells.forEach(([dr,dc])=>{ grid[baseR+dr][baseC+dc]=piece.color; });
    tray[selectedIdx].used = true;
    selectedIdx = -1;
    removeGhost();
    PH.playBeep&&PH.playBeep(660,0.1,'sine',0.1);

    // Check and clear lines
    clearLines();

    // Render
    renderBoard();
    renderTray();

    // All 3 placed → refill tray
    if(tray.every(p=>!p||p.used)){
      tray = [randomPiece(), randomPiece(), randomPiece()];
      selectedIdx = -1;
      renderTray();
      document.getElementById('bb-hint').textContent='NEW PIECES! SELECT ONE TO PLACE';
    } else {
      document.getElementById('bb-hint').textContent='SELECT A PIECE FROM THE TRAY';
    }

    updateHUD();

    // Check game over
    if(!hasAnyMove()){
      setTimeout(endGame, 500);
    }
  }

  // ── Line clearing ──────────────────────────────────────────────────────────
  function clearLines(){
    const rowsToClear = [];
    const colsToClear = [];

    for(let r=0;r<GRID;r++) if(grid[r].every(v=>v)) rowsToClear.push(r);
    for(let c=0;c<GRID;c++) if(grid.every(row=>row[c])) colsToClear.push(c);

    const lineCount = rowsToClear.length + colsToClear.length;
    if(lineCount===0) return;

    // Flash animation
    const toFlash = new Set();
    rowsToClear.forEach(r=>{ for(let c=0;c<GRID;c++) toFlash.add(`${r},${c}`); });
    colsToClear.forEach(c=>{ for(let r=0;r<GRID;r++) toFlash.add(`${r},${c}`); });
    toFlash.forEach(key=>{
      const [r,c]=key.split(',').map(Number);
      const cell=getCellEl(r,c);
      if(cell) cell.classList.add('clearing');
    });

    // Scoring: more lines = exponential bonus (like real Block Blast)
    const BASE_PER_CELL = 10;
    const cellsCleared = rowsToClear.length*GRID + colsToClear.length*GRID;
    const bonus = lineCount >= 2 ? lineCount * lineCount : 1;
    const pts = cellsCleared * BASE_PER_CELL * bonus;
    score += pts;
    totalLines += lineCount;

    // Combo display
    clearTimeout(comboTimer);
    const comboEl=document.getElementById('bb-combo');
    if(lineCount>=2){ comboEl.textContent=`💥 ${lineCount}x COMBO! +${pts}`; }
    else { comboEl.textContent=`+${pts}`; }
    comboTimer=setTimeout(()=>comboEl.textContent='',1500);

    // Clear grid cells
    setTimeout(()=>{
      rowsToClear.forEach(r=>{ for(let c=0;c<GRID;c++) grid[r][c]=null; });
      colsToClear.forEach(c=>{ for(let r=0;r<GRID;r++) grid[r][c]=null; });
      renderBoard();
      updateHUD();
    },380);

    PH.playBeep&&PH.playBeep(880,0.12,'sine',0.15);
    if(lineCount>=2) PH.playWin&&PH.playWin();
  }

  // ── Move check ─────────────────────────────────────────────────────────────
  function hasAnyMove(){
    return tray.some(piece=>{
      if(!piece||piece.used) return false;
      for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++) if(checkCanPlace(piece,r,c)) return true;
      return false;
    });
  }

  // ── HUD ───────────────────────────────────────────────────────────────────
  function updateHUD(){
    document.getElementById('bb-score').textContent=score;
    document.getElementById('bb-lines').textContent=totalLines;
    const best=Math.max(score,bestScore);
    document.getElementById('bb-best').textContent=best;
    document.getElementById('nav-best').textContent=best;
  }

  // ── Game flow ─────────────────────────────────────────────────────────────
  function start(){
    bestScore=parseInt(PH.getHighScore('block-blast'))||0;
    grid=makeGrid(); score=0; totalLines=0; selectedIdx=-1;
    tray=[randomPiece(), randomPiece(), randomPiece()];
    removeGhost(); clearTimeout(comboTimer);
    document.getElementById('bb-combo').textContent='';

    showScreen('screen-game');
    renderBoard();
    renderTray();
    updateHUD();
    document.getElementById('bb-hint').textContent='DRAG A PIECE ONTO THE BOARD';
  }

  function endGame(){
    const best = Math.max(score, bestScore);
    PH.setHighScore('block-blast', score);
    removeGhost();

    document.getElementById('end-score').textContent=score;
    document.getElementById('end-best').textContent=best;
    document.getElementById('end-lines').textContent=totalLines;
    document.getElementById('end-msg').textContent=
      score>bestScore ? '🏆 NEW HIGH SCORE!' : `${totalLines} lines cleared!`;

    PH.playLose&&PH.playLose();
    showScreen('screen-end');
  }

  // Init
  document.getElementById('best-start').textContent=parseInt(PH.getHighScore('block-blast'))||0;
  document.getElementById('nav-best').textContent=parseInt(PH.getHighScore('block-blast'))||0;

  return { start };
})();
</script>
</body>
</html>
