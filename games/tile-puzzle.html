<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tile Slide Puzzle - PixelHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .ts-wrap{max-width:560px;margin:0 auto;padding:20px;text-align:center;}
    #tile-grid{display:grid;margin:0 auto;gap:4px;user-select:none;}
    .tile{display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Press Start 2P',monospace;transition:all 0.15s cubic-bezier(0.25,0.46,0.45,0.94);border:3px solid rgba(0,255,255,0.4);background:linear-gradient(135deg,#1a0040,#0d0020);position:relative;overflow:hidden;}
    .tile:hover{border-color:#00ffff;filter:brightness(1.3);}
    .tile.empty{background:rgba(0,0,0,0.2);border-color:rgba(0,255,255,0.1);cursor:default;}
    .tile.correct{border-color:#00ff88!important;box-shadow:0 0 10px rgba(0,255,136,0.5);}
    .tile::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);pointer-events:none;}
    .ts-info{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
    .ts-stat{font-family:'Press Start 2P',monospace;font-size:10px;color:#aac;}
    .ts-stat span{color:#ffff00;text-shadow:0 0 6px #ffff00;}
    .size-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
    .size-btn{font-family:'Press Start 2P',monospace;font-size:8px;padding:8px 14px;border:2px solid #333;color:#555;background:transparent;cursor:pointer;transition:all 0.2s;}
    .size-btn.active,.size-btn:hover{border-color:#00ffff;color:#00ffff;}
    .progress-bar{height:6px;background:rgba(0,255,255,0.1);margin-bottom:12px;max-width:400px;margin-left:auto;margin-right:auto;border:1px solid rgba(0,255,255,0.2);}
    #ts-progress{height:100%;background:linear-gradient(90deg,#00ffff,#00ff88);transition:width 0.3s;}
  </style>
</head>
<body data-game="tile-puzzle">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">🧩 TILE PUZZLE</span>
    <button class="sound-btn" id="sound-toggle">🔊</button>
  </nav>

  <div id="screen-start" class="game-screen">
    <div class="card" style="max-width:440px;margin:40px auto;padding:30px;text-align:center;">
      <h1 style="font-family:'Press Start 2P',monospace;font-size:16px;color:#00ffff;text-shadow:0 0 20px #00ffff;margin-bottom:16px;">🧩 TILE PUZZLE</h1>
      <p style="font-family:'Share Tech Mono',monospace;color:#aac;line-height:1.7;margin-bottom:24px;">Slide tiles to arrange them in order!<br>Click a tile next to the empty space.<br>Solve faster for bonus points!</p>
      <div class="size-row">
        <button class="size-btn active" id="s-3" onclick="setSize(3,this)">3×3</button>
        <button class="size-btn" id="s-4" onclick="setSize(4,this)">4×4</button>
        <button class="size-btn" id="s-5" onclick="setSize(5,this)">5×5</button>
      </div>
      <div style="text-align:center;margin-bottom:20px;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#ffff00;text-shadow:0 0 10px #ffff00;" id="best-ts">0</span><br><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">BEST SCORE</span></div>
      <button style="font-family:'Press Start 2P',monospace;font-size:12px;padding:16px 32px;border:3px solid #00ffff;color:#00ffff;background:transparent;cursor:pointer;width:100%;letter-spacing:3px;" onclick="startGame()">▶ SOLVE!</button>
    </div>
  </div>

  <div id="screen-game" class="game-screen hidden">
    <div class="ts-wrap">
      <div class="ts-info">
        <div class="ts-stat">MOVES: <span id="ts-moves">0</span></div>
        <div class="ts-stat">TIME: <span id="ts-time">0:00</span></div>
        <div class="ts-stat">SCORE: <span id="ts-score">0</span></div>
      </div>
      <div class="progress-bar"><div id="ts-progress" style="width:0%"></div></div>
      <div id="tile-grid"></div>
      <button style="font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 20px;border:2px solid #333;color:#555;background:transparent;cursor:pointer;margin-top:16px;transition:all 0.2s;" onmouseover="this.style.borderColor='#ff00ff';this.style.color='#ff00ff'" onmouseout="this.style.borderColor='#333';this.style.color='#555'" onclick="shuffleBoard()">🔀 RESHUFFLE</button>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden">
    <div class="card" style="max-width:400px;margin:40px auto;padding:30px;text-align:center;">
      <h2 style="font-family:'Press Start 2P',monospace;font-size:16px;color:#00ffff;text-shadow:0 0 15px #00ffff;margin-bottom:16px;">SOLVED!</h2>
      <div style="display:flex;gap:16px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;">
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:20px;color:#ffff00;text-shadow:0 0 12px #ffff00;display:block;" id="final-ts-score">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">SCORE</span></div>
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:20px;color:#00ff88;text-shadow:0 0 12px #00ff88;display:block;" id="final-ts-moves">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">MOVES</span></div>
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:20px;color:#ff00ff;text-shadow:0 0 12px #ff00ff;display:block;" id="final-ts-time">0:00</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">TIME</span></div>
      </div>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px;border:2px solid #00ffff;color:#00ffff;background:transparent;cursor:pointer;width:100%;margin-bottom:8px;" onclick="startGame()">▶ SOLVE AGAIN</button>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px;border:2px solid #555;color:#555;background:transparent;cursor:pointer;width:100%;" onclick="PH.showScreen('screen-start')">MENU</button>
    </div>
  </div>
</div>
<audio id="bg-music" loop><source src="../assets/music/arcade.mp3" type="audio/mpeg"></audio>
<audio id="sfx-click" src="../assets/sounds/click.mp3" preload="auto"></audio>
<audio id="sfx-win" src="../assets/sounds/win.mp3" preload="auto"></audio>
<audio id="sfx-lose" src="../assets/sounds/lose.mp3" preload="auto"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>
<script>
(function(){
  'use strict';
  let size=3,tiles=[],moves,startTime,timerInterval,emptyPos;
  const TILE_COLORS=['#00ffff','#ff00ff','#ffff00','#00ff88','#ff6600','#0088ff','#cc00ff','#ff2244','#00ccff'];

  window.setSize=function(s,el){
    size=s;
    document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active');
  };

  function goalTiles(){ return Array.from({length:size*size},((_,i)=>i+1)); }

  function isSolvable(arr){
    let inv=0;
    const a=arr.filter(x=>x!==size*size);
    for(let i=0;i<a.length-1;i++) for(let j=i+1;j<a.length;j++) if(a[i]>a[j]) inv++;
    if(size%2===1) return inv%2===0;
    const emptyRow=Math.floor(arr.indexOf(size*size)/size);
    return (inv+size-1-emptyRow)%2===0;
  }

  window.shuffleBoard=function(){
    let arr=goalTiles();
    do{ arr=[...arr].sort(()=>Math.random()-.5); }while(!isSolvable(arr));
    tiles=arr;
    emptyPos=tiles.indexOf(size*size);
    moves=0; document.getElementById('ts-moves').textContent=0;
    renderGrid(); updateProgress();
  };

  function renderGrid(){
    const grid=document.getElementById('tile-grid');
    const TILE_SIZE=Math.min(Math.floor((Math.min(window.innerWidth,540)-40)/(size)),100);
    grid.style.gridTemplateColumns=`repeat(${size},${TILE_SIZE}px)`;
    grid.innerHTML='';
    const goal=goalTiles();
    tiles.forEach((val,idx)=>{
      const div=document.createElement('div');
      div.className='tile'+(val===size*size?' empty':'');
      if(val!==size*size){
        div.style.width=TILE_SIZE+'px'; div.style.height=TILE_SIZE+'px';
        div.style.fontSize=Math.max(10,TILE_SIZE/4)+'px';
        const colorIdx=(val-1)%(TILE_COLORS.length);
        div.style.color=TILE_COLORS[colorIdx];
        div.style.textShadow=`0 0 10px ${TILE_COLORS[colorIdx]}`;
        div.textContent=val;
        if(val===goal[idx]) div.classList.add('correct');
        div.onclick=()=>tryMove(idx);
      } else {
        div.style.width=TILE_SIZE+'px'; div.style.height=TILE_SIZE+'px';
      }
      grid.appendChild(div);
    });
  }

  function tryMove(idx){
    const r=Math.floor(idx/size), c=idx%size;
    const er=Math.floor(emptyPos/size), ec=emptyPos%size;
    if(Math.abs(r-er)+Math.abs(c-ec)!==1) return;
    [tiles[idx],tiles[emptyPos]]=[tiles[emptyPos],tiles[idx]];
    emptyPos=idx; moves++;
    document.getElementById('ts-moves').textContent=moves;
    if(typeof PH!=='undefined'&&PH.playClick) PH.playClick();
    renderGrid(); updateProgress();
    if(isSolved()) endGame();
  }

  function isSolved(){ return tiles.every((v,i)=>v===i+1); }

  function updateProgress(){
    const goal=goalTiles();
    const correct=tiles.filter((v,i)=>v===goal[i]).length;
    const pct=(correct/(size*size))*100;
    document.getElementById('ts-progress').style.width=pct+'%';
    const s=Math.max(0,1000-(moves*10)-Math.floor((Date.now()-startTime)/1000)*5+(correct*20));
    document.getElementById('ts-score').textContent=s;
  }

  function updateTimer(){
    const elapsed=Math.floor((Date.now()-startTime)/1000);
    const m=Math.floor(elapsed/60), s=elapsed%60;
    document.getElementById('ts-time').textContent=m+':'+(s<10?'0':'')+s;
    updateProgress();
  }

  function endGame(){
    clearInterval(timerInterval);
    const elapsed=Math.floor((Date.now()-startTime)/1000);
    const m=Math.floor(elapsed/60), s=elapsed%60;
    const timeStr=m+':'+(s<10?'0':'')+s;
    const finalScore=Math.max(0,1000-(moves*10)-elapsed*5+(size*size*20));
    document.getElementById('final-ts-score').textContent=finalScore;
    document.getElementById('final-ts-moves').textContent=moves;
    document.getElementById('final-ts-time').textContent=timeStr;
    const best=Math.max(finalScore,parseInt(localStorage.getItem('ts_best')||'0'));
    localStorage.setItem('ts_best',best);
    if(typeof PH!=='undefined'){ PH.submitScore('tile-puzzle',finalScore); PH.showScreen('screen-end'); PH.playWin&&PH.playWin(); PH.confetti&&PH.confetti(); }
  }

  window.startGame=function(){
    moves=0; startTime=Date.now(); clearInterval(timerInterval);
    timerInterval=setInterval(updateTimer,1000);
    const best=localStorage.getItem('ts_best')||0;
    document.getElementById('best-ts').textContent=best;
    document.getElementById('ts-moves').textContent=0;
    document.getElementById('ts-score').textContent=0;
    if(typeof PH!=='undefined') PH.showScreen('screen-game');
    shuffleBoard();
  };

  document.getElementById('best-ts').textContent=localStorage.getItem('ts_best')||0;
  if(typeof PH!=='undefined') PH.initGamePage();
})();
</script>
</body>
</html>
