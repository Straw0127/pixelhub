<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake - SkyWorld</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .snake-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px; }
    #snake-canvas { image-rendering:pixelated; border-radius:10px; border:2px solid rgba(255,255,255,0.3); }
    .mobile-controls { display:grid; grid-template-areas:'. up .' 'left . right' '. down .'; gap:6px; margin-top:6px; }
    .ctrl-btn { width:48px; height:48px; background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.3); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.1s; border-radius:8px; -webkit-user-select:none; }
    .ctrl-btn:active { background:rgba(255,255,255,0.28); }
    .ctrl-up{grid-area:up} .ctrl-down{grid-area:down} .ctrl-left{grid-area:left} .ctrl-right{grid-area:right}
    .snake-stats { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
    .snake-stat { font-family:'Fredoka One',cursive; font-size:9px; text-align:center; }
    .snake-stat-num { display:block; font-size:20px; color:#a5d6a7; text-shadow:0 2px 8px rgba(165,214,167,0.4); }
    .snake-stat span { color:rgba(255,255,255,0.6); display:block; margin-top:3px; }
    .level-btns { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
    .lvl-btn { font-family:'Fredoka One',cursive; font-size:7px; padding:7px 12px; border:2px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.06); cursor:pointer; transition:all 0.2s; border-radius:18px; }
    .lvl-btn.active { border-color:#a5d6a7; color:#a5d6a7; background:rgba(165,214,167,0.1); }
    .wrap-badge { font-family:'Fredoka One',cursive; font-size:8px; color:#ffd54f; background:rgba(255,213,79,0.15); border:1px solid rgba(255,213,79,0.4); padding:4px 10px; border-radius:12px; }
    @media(min-width:600px){ .mobile-controls{display:none;} }
  </style>
</head>
<body data-game="snake">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">🐍 SNAKE</span>
    <span class="score-display">BEST: <span id="nav-best">0</span></span>
  </nav>

  <div id="screen-start" class="game-screen" style="position:relative;max-width:460px;margin:30px auto;">
    <h1>🐍 SNAKE</h1>
    <p>Eat food to grow! Screen wraps — go through walls! Avoid your own tail.</p>
    <p style="margin-top:6px;color:#a5d6a7;font-size:11px;">Arrow keys / WASD to move. Swipe on mobile.</p>
    <div style="margin:16px 0;">
      <div style="font-family:'Fredoka One',cursive;font-size:9px;color:rgba(255,255,255,0.6);margin-bottom:10px;letter-spacing:2px;">SELECT LEVEL:</div>
      <div class="level-btns">
        <button class="lvl-btn active" data-level="1">LVL 1<br><span style="font-size:6px;opacity:0.7">PLAIN</span></button>
        <button class="lvl-btn" data-level="2">LVL 2<br><span style="font-size:6px;opacity:0.7">FEW WALLS</span></button>
        <button class="lvl-btn" data-level="3">LVL 3<br><span style="font-size:6px;opacity:0.7">MORE WALLS</span></button>
        <button class="lvl-btn" data-level="4">LVL 4<br><span style="font-size:6px;opacity:0.7">MAZE LITE</span></button>
        <button class="lvl-btn" data-level="5">LVL 5<br><span style="font-size:6px;opacity:0.7">MAZE</span></button>
      </div>
    </div>
    <div class="wrap-badge" style="margin:0 auto 16px;display:inline-block;">🔄 SCREEN WRAPPING ON</div>
    <div style="margin:8px 0;font-family:'Fredoka One',cursive;font-size:9px;color:rgba(255,255,255,0.6);">HIGH SCORE: <span class="neon-green" id="best-display">0</span></div>
    <button class="pixel-btn btn-green" onclick="startSnake()"><span class="btn-span">▶ START GAME</span></button>
  </div>

  <div id="screen-game" class="hidden">
    <div class="snake-wrap">
      <div class="snake-stats">
        <div class="snake-stat"><span class="snake-stat-num" id="score-disp">0</span><span>SCORE</span></div>
        <div class="snake-stat"><span class="snake-stat-num" style="color:#ffd54f" id="length-disp">3</span><span>LENGTH</span></div>
        <div class="snake-stat"><span class="snake-stat-num" style="color:#f8bbd0" id="level-disp">1</span><span>LEVEL</span></div>
        <div class="snake-stat"><span class="snake-stat-num" style="color:#81d4fa" id="speed-disp">1</span><span>SPEED</span></div>
      </div>
      <canvas id="snake-canvas"></canvas>
      <div class="mobile-controls">
        <button class="ctrl-btn ctrl-up"    onclick="setDir(0,-1)">▲</button>
        <button class="ctrl-btn ctrl-left"  onclick="setDir(-1,0)">◀</button>
        <button class="ctrl-btn ctrl-right" onclick="setDir(1,0)">▶</button>
        <button class="ctrl-btn ctrl-down"  onclick="setDir(0,1)">▼</button>
      </div>
      <button class="pixel-btn btn-green" onclick="startSnake()" style="margin-top:4px;"><span class="btn-span">↺ RESTART</span></button>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden" style="position:relative;max-width:440px;margin:40px auto;">
    <h1>💀 GAME OVER!</h1>
    <span class="final-score" id="end-score">0</span>
    <p id="end-msg"></p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
      <button class="pixel-btn btn-green" onclick="startSnake()"><span class="btn-span">▶ PLAY AGAIN</span></button>
      <a href="../index.html" class="pixel-btn btn-cyan"><span class="btn-span">◀ MENU</span></a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>
<script>
const GRID=25; // larger board: 25x25
const CELL=Math.min(Math.floor((Math.min(window.innerWidth,560)-32)/GRID),20);
const W=GRID*CELL, H=GRID*CELL;

let canvas,ctx,snake,dir,nextDir,food,special,score,gameLoop,alive,speedTier,particles=[],obstacles=[],chosenLevel=1;

// Base speeds per difficulty tier (ms per tick)
const BASE_SPEED=[null,160,145,130,115,100]; // index = level 1-5

// Obstacle templates per level (cells to block)
function getObstacles(lvl){
  if(lvl===1) return [];
  const mid=Math.floor(GRID/2);
  if(lvl===2){
    // 4 short walls near corners
    const walls=[];
    for(let i=2;i<=5;i++) walls.push({x:i,y:5},{x:GRID-1-i,y:GRID-6});
    return walls;
  }
  if(lvl===3){
    const walls=[];
    // horizontal bars left and right
    for(let i=3;i<=9;i++) walls.push({x:i,y:7},{x:GRID-1-i,y:GRID-8});
    // vertical bars top and bottom
    for(let i=3;i<=7;i++) walls.push({x:8,y:i},{x:GRID-9,y:GRID-1-i});
    return walls;
  }
  if(lvl===4){
    const walls=[];
    // cross pattern in middle
    for(let i=mid-5;i<=mid-2;i++) walls.push({x:i,y:mid},{x:GRID-1-i,y:mid});
    for(let i=mid-5;i<=mid-2;i++) walls.push({x:mid,y:i},{x:mid,y:GRID-1-i});
    // corner blocks
    for(let i=2;i<=5;i++) walls.push({x:i,y:4},{x:4,y:i},{x:GRID-1-i,y:GRID-5},{x:GRID-5,y:GRID-1-i});
    return walls;
  }
  if(lvl===5){
    const walls=[];
    // Denser maze: corridors
    for(let i=2;i<=10;i++) walls.push({x:i,y:6},{x:GRID-1-i,y:GRID-7});
    for(let i=6;i<=18;i++) walls.push({x:6,y:i});
    for(let i=6;i<=18;i++) walls.push({x:GRID-7,y:i});
    for(let i=8;i<=16;i++) walls.push({x:i,y:12});
    for(let i=10;i<=14;i++) walls.push({x:i,y:18});
    return walls;
  }
  return [];
}

function isObstacle(x,y){ return obstacles.some(o=>o.x===x&&o.y===y); }

function startSnake(){
  chosenLevel=parseInt(document.querySelector('.lvl-btn.active').dataset.level);
  obstacles=getObstacles(chosenLevel);

  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-end').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');

  canvas=document.getElementById('snake-canvas');
  canvas.width=W; canvas.height=H;
  ctx=canvas.getContext('2d');

  snake=[{x:Math.floor(GRID/2),y:Math.floor(GRID/2)},{x:Math.floor(GRID/2)-1,y:Math.floor(GRID/2)},{x:Math.floor(GRID/2)-2,y:Math.floor(GRID/2)}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; alive=true; speedTier=1; particles=[];
  special=null;
  placeFood();
  updateHUD();
  clearInterval(gameLoop);
  gameLoop=setInterval(tick, BASE_SPEED[chosenLevel]);
  PH.playClick&&PH.playClick();

  PH.onSwipe&&PH.onSwipe(canvas,(d)=>{
    if(d==='left'&&dir.x!==1)  nextDir={x:-1,y:0};
    if(d==='right'&&dir.x!==-1) nextDir={x:1,y:0};
    if(d==='up'&&dir.y!==1)    nextDir={x:0,y:-1};
    if(d==='down'&&dir.y!==-1) nextDir={x:0,y:1};
  });
}

function setDir(dx,dy){
  if(dx===1&&dir.x!==-1)  nextDir={x:1,y:0};
  if(dx===-1&&dir.x!==1) nextDir={x:-1,y:0};
  if(dy===-1&&dir.y!==1) nextDir={x:0,y:-1};
  if(dy===1&&dir.y!==-1)  nextDir={x:0,y:1};
}

function placeFood(){
  let pos;
  do{ pos={x:PH.randInt(0,GRID-1),y:PH.randInt(0,GRID-1)}; }
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y)||isObstacle(pos.x,pos.y));
  food=pos;
  if(score>0&&score%80===0) placeSpecial();
}

function placeSpecial(){
  let pos;
  do{ pos={x:PH.randInt(0,GRID-1),y:PH.randInt(0,GRID-1),timer:80}; }
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y)||isObstacle(pos.x,pos.y));
  special=pos;
}

function tick(){
  dir={...nextDir};
  // WRAP: edges wrap around
  let nx=(snake[0].x+dir.x+GRID)%GRID;
  let ny=(snake[0].y+dir.y+GRID)%GRID;
  const head={x:nx,y:ny};

  // Obstacle collision
  if(isObstacle(head.x,head.y)){ endSnake(); return; }
  // Self collision (skip tail tip which will move)
  if(snake.slice(0,-1).some(s=>s.x===head.x&&s.y===head.y)){ endSnake(); return; }

  snake.unshift(head);
  let ate=false;

  if(head.x===food.x&&head.y===food.y){
    score+=10*speedTier; ate=true;
    spawnParticles(head.x*CELL+CELL/2,head.y*CELL+CELL/2,'#ffd54f');
    PH.playBeep&&PH.playBeep(660,0.1,'sine',0.1);
    placeFood();
    // Speed increases every 50 pts (capped)
    const newSpeed=Math.max(60, BASE_SPEED[chosenLevel]-Math.floor(score/50)*8);
    speedTier=Math.floor((BASE_SPEED[chosenLevel]-newSpeed)/8)+1;
    clearInterval(gameLoop);
    gameLoop=setInterval(tick,newSpeed);
  }
  if(special&&head.x===special.x&&head.y===special.y){
    score+=50*speedTier; ate=true;
    spawnParticles(head.x*CELL+CELL/2,head.y*CELL+CELL/2,'#ffd54f');
    PH.playBeep&&PH.playBeep(880,0.15,'sine',0.15);
    special=null;
  }
  if(!ate) snake.pop();
  if(special){ special.timer--; if(special.timer<=0) special=null; }

  updateHUD();
  draw();
}

function spawnParticles(x,y,color){
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2;
    particles.push({x,y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,life:18,color});
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // Background
  ctx.fillStyle='rgba(21,101,192,0.5)';
  ctx.fillRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.05)';
  ctx.lineWidth=1;
  for(let i=0;i<=GRID;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(W,i*CELL); ctx.stroke();
  }

  // Obstacles
  obstacles.forEach(o=>{
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.fillRect(o.x*CELL+1,o.y*CELL+1,CELL-2,CELL-2);
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.fillRect(o.x*CELL+3,o.y*CELL+3,CELL-6,CELL-6);
  });

  // Snake
  snake.forEach((seg,i)=>{
    const t=i/snake.length;
    const g=Math.floor(180+60*(1-t));
    const b=Math.floor(80*(1-t));
    ctx.fillStyle=`rgb(0,${g},${b})`;
    ctx.shadowColor='#66bb6a'; ctx.shadowBlur=i===0?10:3;
    ctx.fillRect(seg.x*CELL+1,seg.y*CELL+1,CELL-2,CELL-2);
    if(i===0){
      ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.shadowBlur=0;
      ctx.fillRect(seg.x*CELL+3,seg.y*CELL+3,3,3);
      ctx.fillRect(seg.x*CELL+CELL-6,seg.y*CELL+3,3,3);
    }
  });
  ctx.shadowBlur=0;

  // Food
  ctx.shadowColor='#ef5350'; ctx.shadowBlur=12;
  ctx.fillStyle='#ef5350';
  ctx.fillRect(food.x*CELL+2,food.y*CELL+2,CELL-4,CELL-4);
  ctx.fillStyle='#ff8a80';
  ctx.fillRect(food.x*CELL+4,food.y*CELL+4,4,4);
  ctx.shadowBlur=0;

  // Special food
  if(special){
    const p=Math.sin(Date.now()/120)*0.35+0.85;
    ctx.shadowColor='#ffd54f'; ctx.shadowBlur=18*p;
    ctx.fillStyle=`rgba(255,213,79,${p})`;
    ctx.fillRect(special.x*CELL+1,special.y*CELL+1,CELL-2,CELL-2);
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.shadowBlur=0;
    ctx.font=`bold ${CELL-4}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('★',special.x*CELL+CELL/2,special.y*CELL+CELL/2);
    ctx.shadowBlur=0;
  }

  // Particles
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    ctx.fillStyle=p.color; ctx.globalAlpha=p.life/18;
    ctx.fillRect(p.x-2,p.y-2,4,4);
    p.x+=p.vx; p.y+=p.vy; p.life--;
  });
  ctx.globalAlpha=1;
}

function updateHUD(){
  document.getElementById('score-disp').textContent=score;
  document.getElementById('length-disp').textContent=snake.length;
  document.getElementById('level-disp').textContent=chosenLevel;
  document.getElementById('speed-disp').textContent=speedTier;
}

function endSnake(){
  clearInterval(gameLoop); alive=false;
  PH.playLose&&PH.playLose();
  PH.shake&&PH.shake();
  setTimeout(()=>{
    document.getElementById('screen-game').classList.add('hidden');
    document.getElementById('screen-end').classList.remove('hidden');
    document.getElementById('end-score').textContent=score+' PTS';
    const isNew=PH.setHighScore('snake',score);
    document.getElementById('end-msg').textContent=
      `Length: ${snake.length} | Level: ${chosenLevel} | Speed: ${speedTier}${isNew?' 🏆 NEW HIGH SCORE!':''}`;
    document.getElementById('nav-best').textContent=PH.getHighScore('snake');
  },600);
}

document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)) e.preventDefault();
  if(e.key==='ArrowLeft'||e.key==='a')  setDir(-1,0);
  if(e.key==='ArrowRight'||e.key==='d') setDir(1,0);
  if(e.key==='ArrowUp'||e.key==='w')    setDir(0,-1);
  if(e.key==='ArrowDown'||e.key==='s')  setDir(0,1);
});

document.querySelectorAll('.lvl-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.lvl-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    PH.playClick&&PH.playClick();
  });
});

document.getElementById('best-display').textContent=PH.getHighScore('snake');
document.getElementById('nav-best').textContent=PH.getHighScore('snake');
</script>
</body>
</html>
