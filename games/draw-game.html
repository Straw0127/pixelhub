<!-- NEW -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw Game - PixelHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .draw-wrap{max-width:700px;margin:0 auto;padding:20px;}
    #canvas-wrap{border:3px solid #00ffff;box-shadow:0 0 20px rgba(0,255,255,0.4);display:inline-block;position:relative;}
    #draw-canvas{display:block;cursor:crosshair;background:#080018;touch-action:none;}
    .tools-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
    .tool-btn{font-family:'Press Start 2P',monospace;font-size:7px;padding:7px 10px;border:2px solid #333;color:#555;background:transparent;cursor:pointer;transition:all 0.2s;}
    .tool-btn.active,.tool-btn:hover{border-color:#00ffff;color:#00ffff;}
    .color-swatch{width:30px;height:30px;border:2px solid #333;cursor:pointer;transition:all 0.2s;}
    .color-swatch.active{border:3px solid #fff;box-shadow:0 0 10px #fff;}
    .size-btn{font-family:'Press Start 2P',monospace;font-size:8px;padding:6px 10px;border:2px solid #333;color:#555;background:transparent;cursor:pointer;transition:all 0.2s;}
    .size-btn.active,.size-btn:hover{border-color:#ff00ff;color:#ff00ff;}
    .prompt-box{border:2px solid #ff00ff;padding:16px;background:rgba(255,0,255,0.05);margin-bottom:16px;text-align:center;}
    .prompt-label{font-family:'Press Start 2P',monospace;font-size:8px;color:#ff00ff;margin-bottom:8px;letter-spacing:2px;}
    .prompt-word{font-family:'Press Start 2P',monospace;font-size:18px;color:#fff;letter-spacing:3px;}
    .timer-bar-wrap{height:8px;background:rgba(255,255,255,0.1);margin-bottom:16px;border:1px solid #333;}
    #timer-bar{height:100%;background:linear-gradient(90deg,#00ffff,#ff00ff);transition:width 0.1s linear;width:100%;}
    .draw-info{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;}
    .draw-stat{font-family:'Press Start 2P',monospace;font-size:9px;color:#aac;}
    .draw-stat span{color:#ffff00;text-shadow:0 0 6px #ffff00;}
    .guess-section{display:flex;gap:10px;margin-top:12px;}
    #guess-input{font-family:'Share Tech Mono',monospace;font-size:14px;padding:10px;background:rgba(0,0,30,0.8);border:2px solid #333;color:#fff;flex:1;outline:none;}
    #guess-input:focus{border-color:#00ffff;box-shadow:0 0 10px rgba(0,255,255,0.3);}
    .guess-btn{font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 16px;border:2px solid #00ffff;color:#00ffff;background:transparent;cursor:pointer;transition:all 0.2s;}
    .guess-btn:hover{background:rgba(0,255,255,0.1);}
    .guess-history{max-height:120px;overflow-y:auto;margin-top:10px;}
    .guess-entry{font-family:'Share Tech Mono',monospace;font-size:11px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
    .guess-entry.correct{color:#00ff88;}
    .guess-entry.close{color:#ffff00;}
    .guess-entry.wrong{color:#ff4444;}
  </style>
</head>
<body data-game="draw-game">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">✏️ DRAW GAME</span>
    <button class="sound-btn" id="sound-toggle">🔊</button>
  </nav>

  <div id="screen-start" class="game-screen">
    <div class="card" style="max-width:480px;margin:40px auto;padding:30px;text-align:center;">
      <h1 style="font-family:'Press Start 2P',monospace;font-size:20px;color:#00ffff;text-shadow:0 0 20px #00ffff;margin-bottom:16px;">✏️ DRAW GAME</h1>
      <p style="font-family:'Share Tech Mono',monospace;color:#aac;line-height:1.7;margin-bottom:24px;">Draw the prompt before time runs out!<br>Try to draw all 5 prompts.<br>Bonus points for speed!</p>
      <div style="display:flex;gap:20px;justify-content:center;margin-bottom:24px;">
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:18px;color:#ffff00;text-shadow:0 0 10px #ffff00;display:block;" id="best-draw">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">BEST SCORE</span></div>
      </div>
      <button style="font-family:'Press Start 2P',monospace;font-size:12px;padding:16px 32px;border:3px solid #00ffff;color:#00ffff;background:transparent;cursor:pointer;width:100%;letter-spacing:3px;" onclick="startGame()">▶ PLAY NOW</button>
    </div>
  </div>

  <div id="screen-game" class="game-screen hidden">
    <div class="draw-wrap">
      <div class="draw-info">
        <div class="draw-stat">SCORE: <span id="draw-score">0</span></div>
        <div class="draw-stat">ROUND: <span id="draw-round">1</span>/5</div>
        <div class="draw-stat">TIME: <span id="draw-timer">60</span>s</div>
      </div>
      <div class="prompt-box">
        <div class="prompt-label">▸ DRAW THIS:</div>
        <div class="prompt-word" id="prompt-word">CAT</div>
      </div>
      <div class="timer-bar-wrap"><div id="timer-bar"></div></div>
      <div class="tools-row" id="tools-row">
        <button class="tool-btn active" id="tool-draw" onclick="setTool('draw')">✏ DRAW</button>
        <button class="tool-btn" id="tool-erase" onclick="setTool('erase')">◻ ERASE</button>
        <button class="tool-btn" onclick="clearCanvas()">🗑 CLEAR</button>
        <div style="width:2px;height:30px;background:#333;"></div>
        <button class="size-btn active" onclick="setSize(3,this)">S</button>
        <button class="size-btn" onclick="setSize(8,this)">M</button>
        <button class="size-btn" onclick="setSize(16,this)">L</button>
        <div style="width:2px;height:30px;background:#333;"></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;" id="palette"></div>
      <div id="canvas-wrap">
        <canvas id="draw-canvas" width="500" height="320"></canvas>
      </div>
      <div class="guess-section">
        <input type="text" id="guess-input" placeholder="TYPE YOUR GUESS..." autocomplete="off" onkeydown="if(event.key==='Enter')submitGuess()">
        <button class="guess-btn" onclick="submitGuess()">GUESS</button>
        <button class="guess-btn" onclick="skipRound()" style="border-color:#ff6600;color:#ff6600;">SKIP</button>
      </div>
      <div class="guess-history" id="guess-history"></div>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden">
    <div class="card" style="max-width:400px;margin:40px auto;padding:30px;text-align:center;">
      <h2 style="font-family:'Press Start 2P',monospace;font-size:16px;color:#00ffff;text-shadow:0 0 15px #00ffff;margin-bottom:16px;">GAME OVER!</h2>
      <div style="display:flex;gap:20px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;">
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#ffff00;text-shadow:0 0 12px #ffff00;display:block;" id="final-draw-score">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">SCORE</span></div>
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#00ff88;text-shadow:0 0 12px #00ff88;display:block;" id="final-draw-correct">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">CORRECT</span></div>
      </div>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px 28px;border:2px solid #00ffff;color:#00ffff;background:transparent;cursor:pointer;width:100%;margin-bottom:8px;" onclick="startGame()">▶ PLAY AGAIN</button>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px 28px;border:2px solid #555;color:#555;background:transparent;cursor:pointer;width:100%;" onclick="PH.showScreen('screen-start')">MENU</button>
    </div>
  </div>
</div>

<audio id="bg-music" loop><source src="../assets/music/arcade.mp3" type="audio/mpeg"></audio>
<audio id="sfx-click" src="../assets/sounds/click.mp3" preload="auto"></audio>
<audio id="sfx-win" src="../assets/sounds/win.mp3" preload="auto"></audio>
<audio id="sfx-lose" src="../assets/sounds/lose.mp3" preload="auto"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>
<script>
(function(){
  'use strict';
  const WORDS=['CAT','DOG','HOUSE','TREE','FISH','SUN','CAR','STAR','MOON','BOAT','BIRD','CAKE','CLOUD','FLOWER','PIZZA','ROBOT','DRAGON','CASTLE','ROCKET','MUSHROOM'];
  const PALETTE=['#ffffff','#ff2244','#ff6600','#ffff00','#00ff88','#00ffff','#0088ff','#cc00ff','#ff00ff','#8B4513','#808080','#000000'];
  let score=0,round=1,timeLeft=60,timer=null,currentWord='',tool='draw',brushSize=3,isDrawing=false;
  let lastX=0,lastY=0,guesses=[],correct=0,usedWords=[];

  const canvas=()=>document.getElementById('draw-canvas');
  const ctx=()=>canvas().getContext('2d');
  let paintColor='#ffffff';

  function buildPalette(){
    const pal=document.getElementById('palette'); pal.innerHTML='';
    PALETTE.forEach(hex=>{
      const sw=document.createElement('div'); sw.className='color-swatch'+(hex===paintColor?' active':'');
      sw.style.backgroundColor=hex; sw.style.boxShadow=hex===paintColor?`0 0 8px ${hex}`:'none';
      sw.onclick=()=>{ paintColor=hex; tool='draw'; document.getElementById('tool-draw').classList.add('active'); document.getElementById('tool-erase').classList.remove('active'); buildPalette(); };
      pal.appendChild(sw);
    });
  }

  window.setTool=function(t){
    tool=t;
    document.getElementById('tool-draw').classList.toggle('active',t==='draw');
    document.getElementById('tool-erase').classList.toggle('active',t==='erase');
  };
  window.setSize=function(s,el){
    brushSize=s;
    document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
  };
  window.clearCanvas=function(){
    const c=canvas(); ctx().clearRect(0,0,c.width,c.height);
  };

  function setupCanvas(){
    const c=canvas();
    c.onmousedown=e=>{isDrawing=true;const r=c.getBoundingClientRect();lastX=e.clientX-r.left;lastY=e.clientY-r.top;};
    c.onmousemove=e=>{if(!isDrawing) return; const r=c.getBoundingClientRect(); draw(e.clientX-r.left,e.clientY-r.top);};
    c.onmouseup=c.onmouseleave=()=>isDrawing=false;
    c.ontouchstart=e=>{e.preventDefault();isDrawing=true;const r=c.getBoundingClientRect();lastX=e.touches[0].clientX-r.left;lastY=e.touches[0].clientY-r.top;};
    c.ontouchmove=e=>{e.preventDefault();if(!isDrawing) return; const r=c.getBoundingClientRect(); draw(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);};
    c.ontouchend=()=>isDrawing=false;
  }

  function draw(x,y){
    const c=ctx();
    c.beginPath();
    c.moveTo(lastX,lastY);
    c.lineTo(x,y);
    c.strokeStyle=tool==='erase'?'#080018':paintColor;
    c.lineWidth=tool==='erase'?brushSize*3:brushSize;
    c.lineCap='round';
    c.stroke();
    lastX=x; lastY=y;
  }

  function pickWord(){
    const available=WORDS.filter(w=>!usedWords.includes(w));
    if(!available.length){ usedWords=[]; return WORDS[Math.floor(Math.random()*WORDS.length)]; }
    const w=available[Math.floor(Math.random()*available.length)];
    usedWords.push(w); return w;
  }

  function startRound(){
    currentWord=pickWord();
    guesses=[];
    document.getElementById('prompt-word').textContent=currentWord;
    document.getElementById('draw-round').textContent=round;
    document.getElementById('guess-history').innerHTML='';
    document.getElementById('guess-input').value='';
    clearCanvas();
    timeLeft=60;
    document.getElementById('draw-timer').textContent=timeLeft;
    document.getElementById('timer-bar').style.width='100%';
    clearInterval(timer);
    timer=setInterval(()=>{
      timeLeft--;
      document.getElementById('draw-timer').textContent=timeLeft;
      document.getElementById('timer-bar').style.width=(timeLeft/60*100)+'%';
      if(timeLeft<=0){ clearInterval(timer); nextRound(false); }
    },1000);
  }

  function nextRound(guessed){
    clearInterval(timer);
    if(guessed){ correct++; const bonus=Math.ceil(timeLeft*5); score+=100+bonus; document.getElementById('draw-score').textContent=score; if(typeof PH!=='undefined'&&PH.playWin) PH.playWin(); }
    else { if(typeof PH!=='undefined'&&PH.playLose) PH.playLose(); }
    round++;
    if(round>5){ endGame(); return; }
    setTimeout(startRound,1000);
  }

  window.submitGuess=function(){
    const inp=document.getElementById('guess-input');
    const val=inp.value.trim().toUpperCase();
    if(!val) return;
    inp.value='';
    const entry=document.createElement('div');
    entry.className='guess-entry';
    if(val===currentWord){ entry.className='guess-entry correct'; entry.textContent='✓ '+val+' - CORRECT!'; document.getElementById('guess-history').appendChild(entry); nextRound(true); return; }
    else if(currentWord.includes(val)||val.includes(currentWord.slice(0,3))) entry.className='guess-entry close';
    else entry.className='guess-entry wrong';
    entry.textContent='✗ '+val;
    document.getElementById('guess-history').appendChild(entry);
    document.getElementById('guess-history').scrollTop=9999;
  };

  window.skipRound=function(){ nextRound(false); };

  function endGame(){
    clearInterval(timer);
    const best=parseInt(localStorage.getItem('draw_best')||'0');
    if(score>best) localStorage.setItem('draw_best',score);
    document.getElementById('final-draw-score').textContent=score;
    document.getElementById('final-draw-correct').textContent=correct;
    if(typeof PH!=='undefined'){ PH.submitScore('draw-game',score); PH.showScreen('screen-end'); }
    if(correct>=4&&typeof PH!=='undefined'&&PH.confetti) PH.confetti();
  }

  window.startGame=function(){
    score=0; round=1; correct=0; usedWords=[]; guesses=[];
    document.getElementById('draw-score').textContent=0;
    const best=localStorage.getItem('draw_best')||0;
    document.getElementById('best-draw').textContent=best;
    if(typeof PH!=='undefined') PH.showScreen('screen-game');
    buildPalette(); setupCanvas(); startRound();
  };

  const best=localStorage.getItem('draw_best')||0;
  document.getElementById('best-draw').textContent=best;
  if(typeof PH!=='undefined') PH.initGamePage();
})();
</script>
</body>
</html>
