<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong - PixelHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .pong-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px; }
    #pong-canvas { image-rendering:pixelated; }
    .pong-controls-mobile { display:flex; gap:20px; margin-top:10px; }
    .pong-btn { width:80px; height:60px; background:rgba(255,255,0,0.1); border:2px solid rgba(255,255,0,0.4); color:#ffff00; font-size:24px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.1s; border-radius:0; -webkit-user-select:none; }
    .pong-btn:active { background:rgba(255,255,0,0.3); }
    @media(min-width:600px){ .pong-controls-mobile{display:none;} }
    .pong-scores { display:flex; gap:40px; align-items:center; }
    .pong-score-num { font-family:'Press Start 2P',monospace; font-size:32px; }
    .p1-score { color:#00ffff; text-shadow:0 0 15px #00ffff; }
    .p2-score { color:#ff00ff; text-shadow:0 0 15px #ff00ff; }
    .pong-vs { font-family:'Press Start 2P',monospace; font-size:12px; color:#444; }
    .speed-btns { display:flex; gap:10px; justify-content:center; }
    .speed-btn { font-family:'Press Start 2P',monospace; font-size:8px; padding:8px 14px; border:2px solid #444; color:#666; background:transparent; cursor:pointer; transition:all 0.2s; }
    .speed-btn.active { border-color:#ffff00; color:#ffff00; box-shadow:0 0 8px rgba(255,255,0,0.3); }
  </style>
</head>
<body data-game="pong">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">🏓 PONG</span>
    <button class="sound-btn" id="sound-toggle">🔊</button>
  </nav>

  <div id="screen-start" class="game-screen" style="position:relative;max-width:440px;margin:40px auto;">
    <h1>🏓 PONG</h1>
    <p>Classic arcade paddle game! First to <strong style="color:#ffff00">7 points</strong> wins.<br>Use W/S or ↑/↓ keys. Touch/drag on mobile.</p>
    <div style="margin:20px 0;">
      <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:#aac;margin-bottom:12px;letter-spacing:2px;">AI SPEED:</div>
      <div class="speed-btns">
        <button class="speed-btn active" data-speed="0.04">EASY</button>
        <button class="speed-btn" data-speed="0.07">MEDIUM</button>
        <button class="speed-btn" data-speed="0.1">HARD</button>
      </div>
    </div>
    <button class="pixel-btn btn-yellow" onclick="startPong()"><span class="btn-span">▶ START GAME</span></button>
  </div>

  <div id="screen-game" class="hidden">
    <div class="pong-wrap">
      <div class="pong-scores">
        <span class="pong-score-num p1-score" id="p1-score">0</span>
        <span class="pong-vs">VS</span>
        <span class="pong-score-num p2-score" id="p2-score">0</span>
      </div>
      <div style="display:flex;gap:40px;font-family:'Press Start 2P',monospace;font-size:8px;color:#aac;">
        <span style="color:#00ffff">YOU</span>
        <span style="color:#ff00ff">AI</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="pong-canvas"></canvas>
      </div>
      <div class="pong-controls-mobile">
        <button class="pong-btn" id="btn-up">▲</button>
        <button class="pong-btn" id="btn-down">▼</button>
      </div>
      <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:#444;margin-top:4px;" id="pong-hint">W/S OR ↑/↓ TO MOVE</div>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden" style="position:relative;max-width:440px;margin:40px auto;">
    <h1 id="end-title">🏆 YOU WIN!</h1>
    <span class="final-score" id="end-score">7 - 0</span>
    <p id="end-msg"></p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
      <button class="pixel-btn btn-yellow" onclick="startPong()"><span class="btn-span">▶ PLAY AGAIN</span></button>
      <a href="../index.html" class="pixel-btn btn-cyan"><span class="btn-span">◀ MENU</span></a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>

<script>
const CW=Math.min(500,window.innerWidth-40), CH=Math.round(CW*0.6);
const PAD_W=12, PAD_H=80, BALL_S=10, WIN_SCORE=7;
let canvas, ctx, gloop;
let p1y, p2y, bx, by, bdx, bdy, p1s, p2s, keys={}, aiSpeed=0.04;
let particles=[];

function startPong(){
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-end').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  
  aiSpeed=parseFloat(document.querySelector('.speed-btn.active').dataset.speed);
  canvas=document.getElementById('pong-canvas');
  canvas.width=CW; canvas.height=CH;
  ctx=canvas.getContext('2d');
  
  p1y=CH/2-PAD_H/2; p2y=CH/2-PAD_H/2;
  p1s=0; p2s=0;
  document.getElementById('p1-score').textContent=0;
  document.getElementById('p2-score').textContent=0;
  resetBall();
  
  clearInterval(gloop);
  gloop=setInterval(update,16);
  PH.playClick&&PH.playClick();
}

function resetBall(){
  bx=CW/2; by=CH/2;
  const angle=(Math.random()*60-30)*(Math.PI/180);
  const speed=CW*0.008;
  bdx=(Math.random()>0.5?1:-1)*speed*Math.cos(angle);
  bdy=speed*Math.sin(angle);
}

function update(){
  // Input
  const spd=CH*0.015;
  if(keys['w']||keys['arrowup']) p1y=Math.max(0,p1y-spd);
  if(keys['s']||keys['arrowdown']) p1y=Math.min(CH-PAD_H,p1y+spd);
  
  // AI
  const aiTarget=by-PAD_H/2;
  const diff=aiTarget-p2y;
  p2y+=Math.min(Math.abs(diff),Math.abs(bdx)*aiSpeed*CH)*Math.sign(diff);
  p2y=Math.max(0,Math.min(CH-PAD_H,p2y));
  
  // Ball
  bx+=bdx; by+=bdy;
  
  // Walls
  if(by<=BALL_S/2||by>=CH-BALL_S/2){ bdy=-bdy; PH.playBeep&&PH.playBeep(330,0.06,'square',0.08); }
  
  // Paddle collision P1
  if(bx-BALL_S/2<=PAD_W+16&&by>=p1y&&by<=p1y+PAD_H&&bdx<0){
    bdx=Math.abs(bdx)*1.05;
    const rel=(by-(p1y+PAD_H/2))/(PAD_H/2);
    bdy=rel*CW*0.01;
    particles.push(...genParticles(bx,by,'#00ffff'));
    PH.playBeep&&PH.playBeep(660,0.08,'sine',0.12);
  }
  // Paddle collision P2
  if(bx+BALL_S/2>=CW-PAD_W-16&&by>=p2y&&by<=p2y+PAD_H&&bdx>0){
    bdx=-Math.abs(bdx)*1.05;
    const rel=(by-(p2y+PAD_H/2))/(PAD_H/2);
    bdy=rel*CW*0.01;
    particles.push(...genParticles(bx,by,'#ff00ff'));
    PH.playBeep&&PH.playBeep(440,0.08,'sine',0.12);
  }
  
  // Scoring
  if(bx<0){ p2s++; document.getElementById('p2-score').textContent=p2s; PH.playBeep&&PH.playBeep(200,0.2,'sawtooth',0.12); resetBall(); }
  if(bx>CW){ p1s++; document.getElementById('p1-score').textContent=p1s; PH.playBeep&&PH.playBeep(880,0.2,'sine',0.12); resetBall(); }
  
  if(p1s>=WIN_SCORE||p2s>=WIN_SCORE){ clearInterval(gloop); setTimeout(endPong,400); }
  
  // Particles
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; p.vx*=0.9; p.vy*=0.9; });
  
  draw();
}

function genParticles(x,y,color){
  return Array.from({length:6},()=>{
    const a=Math.random()*Math.PI*2, s=1+Math.random()*3;
    return {x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:15,color};
  });
}

function draw(){
  ctx.fillStyle='#050010'; ctx.fillRect(0,0,CW,CH);
  
  // Center line
  ctx.setLineDash([10,10]);
  ctx.strokeStyle='rgba(255,255,255,0.08)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(CW/2,0); ctx.lineTo(CW/2,CH); ctx.stroke();
  ctx.setLineDash([]);
  
  // P1 paddle
  ctx.shadowColor='#00ffff'; ctx.shadowBlur=15;
  ctx.fillStyle='#00ffff';
  ctx.fillRect(16,p1y,PAD_W,PAD_H);
  
  // P2 paddle
  ctx.shadowColor='#ff00ff'; ctx.shadowBlur=15;
  ctx.fillStyle='#ff00ff';
  ctx.fillRect(CW-PAD_W-16,p2y,PAD_W,PAD_H);
  
  // Ball
  const pulse=Math.sin(Date.now()/80)*3;
  ctx.shadowColor='#ffff00'; ctx.shadowBlur=20+pulse;
  ctx.fillStyle='#ffff00';
  ctx.fillRect(bx-BALL_S/2,by-BALL_S/2,BALL_S,BALL_S);
  ctx.shadowBlur=0;
  
  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/15;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-3,p.y-3,6,6);
  });
  ctx.globalAlpha=1;
}

function endPong(){
  const win=p1s>=WIN_SCORE;
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-end').classList.remove('hidden');
  document.getElementById('end-title').textContent=win?'🏆 YOU WIN!':'💀 AI WINS!';
  document.getElementById('end-score').textContent=p1s+' - '+p2s;
  document.getElementById('end-msg').textContent=win?'Excellent rally! You defeated the AI!':'Better luck next time!';
  if(win){ PH.playWin&&PH.playWin(); PH.confetti&&PH.confetti(); PH.setHighScore&&PH.setHighScore('pong', p1s); }
  else { PH.playLose&&PH.playLose(); }
}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
});
document.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

// Mobile touch
document.getElementById('btn-up')?.addEventListener('touchstart',()=>keys['arrowup']=true,{passive:true});
document.getElementById('btn-up')?.addEventListener('touchend',()=>keys['arrowup']=false,{passive:true});
document.getElementById('btn-down')?.addEventListener('touchstart',()=>keys['arrowdown']=true,{passive:true});
document.getElementById('btn-down')?.addEventListener('touchend',()=>keys['arrowdown']=false,{passive:true});

document.querySelectorAll('.speed-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{ document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); PH.playClick&&PH.playClick(); });
});
</script>
</body>
</html>
