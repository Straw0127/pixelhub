<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Quiz - SkyWorld</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .math-wrap { display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px; max-width:500px; margin:0 auto; width:100%; }
    .question-box { font-family:'Fredoka One',cursive; font-size:clamp(28px,6vw,52px); color:#ffd54f; text-shadow:0 2px 16px rgba(0,80,200,0.3); padding:24px 40px; border:2px solid rgba(255,255,255,0.28); background:rgba(21,101,192,0.28); text-align:center; width:100%; min-height:100px; display:flex; align-items:center; justify-content:center; transition:all 0.3s; }
    .question-box.correct-flash { background:rgba(0,255,136,0.15); border-color:#a5d6a7; }
    .question-box.wrong-flash { background:rgba(255,68,68,0.15); border-color:#ff4444; animation:shake2 0.3s ease; }
    @keyframes shake2 { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    .answer-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; }
    .answer-opt { font-family:'Fredoka One',cursive; font-size:clamp(14px,3vw,20px); padding:20px; border:2px solid rgba(255,255,255,0.28); background:rgba(21,101,192,0.2); color:#ffd54f; cursor:pointer; text-align:center; transition:all 0.2s; }
    .answer-opt:hover:not(:disabled) { border-color:#ffd54f; background:rgba(255,213,79,0.12); box-shadow:0 4px 16px rgba(0,0,0,0.15); transform:scale(1.03); }
    .answer-opt.correct { border-color:#a5d6a7 !important; background:rgba(0,255,136,0.2) !important; color:#a5d6a7 !important; }
    .answer-opt.wrong { border-color:#ff4444 !important; background:rgba(255,68,68,0.2) !important; color:#ff4444 !important; }
    .answer-opt:disabled { cursor:default; }
    .math-stats { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; width:100%; }
    .math-stat { text-align:center; padding:10px 16px; background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.2); border-radius:10px; flex:1; min-width:80px; backdrop-filter:blur(4px); }
    .math-stat-num { font-family:'Fredoka One',cursive; font-size:20px; display:block; }
    .math-stat-label { font-size:8px; color:rgba(255,255,255,0.6); font-family:'Fredoka One',cursive; display:block; margin-top:3px; }
    .diff-math { display:flex; gap:10px; justify-content:center; }
    .diff-math-btn { font-family:'Fredoka One',cursive; font-size:8px; padding:8px 14px; border:2px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.08); cursor:pointer; transition:all 0.2s; border-radius:20px; }
    .diff-math-btn.active { border-color:#ffd54f; color:#ffd54f; background:rgba(255,213,79,0.1); box-shadow:0 2px 10px rgba(255,213,79,0.2); }
    .lives { display:flex; gap:8px; font-size:20px; }
    .streak-bar { width:100%; height:6px; background:rgba(255,255,255,0.15); border-radius:3px; }
    .streak-fill { height:100%; background:linear-gradient(90deg,#ffd54f,#ff9800); border-radius:3px; transition:width 0.4s ease; }
    #feedback-label { font-family:'Fredoka One',cursive; font-size:12px; min-height:20px; text-align:center; letter-spacing:2px; }
    .math-input { background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.35); color:#ffd54f; font-family:'Fredoka One',cursive; font-size:24px; padding:14px; text-align:center; width:100%; outline:none; transition:all 0.2s; border-radius:10px; }
    .math-input:focus { border-color:rgba(255,213,79,0.7); box-shadow:0 4px 18px rgba(0,0,0,0.15); background:rgba(255,255,255,0.2); }
  </style>
</head>
<body data-game="math-quiz">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">🔢 MATH QUIZ</span>
    <span class="score-display">BEST: <span id="nav-best">0</span></span>
  </nav>

  <div id="screen-start" class="game-screen" style="position:relative;max-width:440px;margin:40px auto;">
    <h1>🔢 MATH QUIZ</h1>
    <p>Quick arithmetic! Answer as fast as possible. You get 3 lives. 20 questions per round!</p>
    <div style="margin:20px 0;">
      <div style="font-family:'Fredoka One',cursive;font-size:9px;color:rgba(255,255,255,0.6);margin-bottom:12px;letter-spacing:2px;">DIFFICULTY:</div>
      <div class="diff-math">
        <button class="diff-math-btn active" data-diff="easy">EASY<br><span style="font-size:7px;color:#777">+−</span></button>
        <button class="diff-math-btn" data-diff="medium">MEDIUM<br><span style="font-size:7px;color:#777">+−×</span></button>
        <button class="diff-math-btn" data-diff="hard">HARD<br><span style="font-size:7px;color:#777">+−×÷</span></button>
      </div>
    </div>
    <div style="font-family:'Fredoka One',cursive;font-size:9px;color:rgba(255,255,255,0.6);margin-bottom:16px;">
      HIGH SCORE: <span class="neon-yellow" id="best-display">0</span>
    </div>
    <button class="pixel-btn btn-yellow" onclick="startMath()"><span class="btn-span">▶ START QUIZ</span></button>
  </div>

  <div id="screen-game" class="hidden">
    <div class="math-wrap">
      <div class="math-stats">
        <div class="math-stat"><span class="math-stat-num neon-yellow" id="score-disp">0</span><span class="math-stat-label">SCORE</span></div>
        <div class="math-stat"><span class="math-stat-num neon-cyan" id="q-disp">0/20</span><span class="math-stat-label">QUESTION</span></div>
        <div class="math-stat"><span class="math-stat-num" style="color:#ffd54f;text-shadow:0 2px 8px rgba(255,213,79,0.4)" id="timer-disp">10</span><span class="math-stat-label">SECS</span></div>
        <div class="math-stat"><span class="math-stat-num neon-green" id="streak-disp">0</span><span class="math-stat-label">STREAK</span></div>
      </div>
      <div class="lives" id="lives-disp">❤️❤️❤️</div>
      <div class="streak-bar"><div class="streak-fill" id="streak-fill" style="width:0%"></div></div>
      <div class="question-box" id="question-box">?</div>
      <div id="feedback-label"></div>
      <div class="answer-grid" id="answer-grid"></div>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden" style="position:relative;max-width:440px;margin:40px auto;">
    <h1 id="end-title">🏆 QUIZ DONE!</h1>
    <span class="final-score" id="end-score">0</span>
    <div style="display:flex;gap:20px;justify-content:center;margin:16px 0;flex-wrap:wrap;">
      <div style="text-align:center;font-family:'Fredoka One',cursive;font-size:9px;">
        <span style="color:#a5d6a7;font-size:20px;display:block;" id="end-correct">0</span>
        <span style="color:rgba(255,255,255,0.6);">CORRECT</span>
      </div>
      <div style="text-align:center;font-family:'Fredoka One',cursive;font-size:9px;">
        <span style="color:#ff4444;font-size:20px;display:block;" id="end-wrong">0</span>
        <span style="color:rgba(255,255,255,0.6);">WRONG</span>
      </div>
      <div style="text-align:center;font-family:'Fredoka One',cursive;font-size:9px;">
        <span style="color:#ffd54f;font-size:20px;display:block;" id="end-maxstreak">0</span>
        <span style="color:rgba(255,255,255,0.6);">MAX STREAK</span>
      </div>
    </div>
    <p id="end-msg"></p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
      <button class="pixel-btn btn-yellow" onclick="startMath()"><span class="btn-span">▶ PLAY AGAIN</span></button>
      <a href="../index.html" class="pixel-btn btn-cyan"><span class="btn-span">◀ MENU</span></a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>

<script>
let score=0, streak=0, maxStreak=0, lives=3, qNum=0, correctCount=0, wrongCount=0;
let diff='easy', currentAnswer=0, qTimer=null, timeLeft=10, answering=false;
const TOTAL_Q=20;

function startMath(){
  diff=document.querySelector('.diff-math-btn.active').dataset.diff;
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-end').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  score=0; streak=0; maxStreak=0; lives=3; qNum=0; correctCount=0; wrongCount=0;
  updateLives();
  nextQuestion();
  PH.playClick&&PH.playClick();
}

function genQuestion(){
  const ops=diff==='easy'?['+','-']:diff==='medium'?['+','-','×']:['+','-','×','÷'];
  const op=ops[Math.floor(Math.random()*ops.length)];
  let a,b,ans;
  if(op==='+'){
    a=PH.randInt(diff==='easy'?1:1,diff==='easy'?20:diff==='medium'?50:100);
    b=PH.randInt(diff==='easy'?1:1,diff==='easy'?20:diff==='medium'?50:100);
    ans=a+b;
  } else if(op==='-'){
    a=PH.randInt(10,diff==='easy'?30:100);
    b=PH.randInt(1,a);
    ans=a-b;
  } else if(op==='×'){
    a=PH.randInt(2,diff==='medium'?10:15);
    b=PH.randInt(2,diff==='medium'?10:15);
    ans=a*b;
  } else {
    b=PH.randInt(2,10);
    ans=PH.randInt(1,10);
    a=ans*b;
  }
  return {q:`${a} ${op} ${b} = ?`, ans};
}

function nextQuestion(){
  if(qNum>=TOTAL_Q||lives<=0){ endQuiz(); return; }
  clearInterval(qTimer);
  answering=false;
  qNum++;
  const {q,ans}=genQuestion();
  currentAnswer=ans;
  
  document.getElementById('q-disp').textContent=qNum+'/'+TOTAL_Q;
  document.getElementById('question-box').textContent=q;
  document.getElementById('question-box').className='question-box';
  document.getElementById('feedback-label').textContent='';
  
  // Generate options
  const opts=new Set([ans]);
  while(opts.size<4){
    const wrong=ans+PH.randInt(-Math.max(5,Math.abs(ans)*0.5),Math.max(5,Math.abs(ans)*0.5));
    if(wrong!==ans) opts.add(wrong);
  }
  const shuffled=PH.shuffle([...opts]);
  
  const grid=document.getElementById('answer-grid');
  grid.innerHTML='';
  shuffled.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='answer-opt';
    btn.textContent=opt;
    btn.addEventListener('click',()=>pickAnswer(opt,btn));
    grid.appendChild(btn);
  });
  
  timeLeft=diff==='easy'?10:diff==='medium'?8:6;
  document.getElementById('timer-disp').textContent=timeLeft;
  document.getElementById('timer-disp').style.color='#ffff00';
  
  qTimer=setInterval(()=>{
    timeLeft--;
    document.getElementById('timer-disp').textContent=timeLeft;
    if(timeLeft<=3) document.getElementById('timer-disp').style.color='#ff4444';
    if(timeLeft<=0){ clearInterval(qTimer); timeoutAnswer(); }
  },1000);
}

function pickAnswer(val,btn){
  if(answering) return;
  answering=true;
  clearInterval(qTimer);
  
  if(val===currentAnswer){
    const pts=100+streak*20+(timeLeft*10);
    score+=pts; streak++; correctCount++;
    maxStreak=Math.max(maxStreak,streak);
    btn.classList.add('correct');
    document.getElementById('question-box').classList.add('correct-flash');
    document.getElementById('feedback-label').textContent='✓ CORRECT! +'+pts;
    document.getElementById('feedback-label').style.color='#a5d6a7';
    PH.playMatch&&PH.playMatch();
  } else {
    lives--; streak=0; wrongCount++;
    btn.classList.add('wrong');
    // Show correct
    document.querySelectorAll('.answer-opt').forEach(b=>{ if(+b.textContent===currentAnswer) b.classList.add('correct'); });
    document.getElementById('question-box').classList.add('wrong-flash');
    document.getElementById('feedback-label').textContent='✗ WRONG! ANS: '+currentAnswer;
    document.getElementById('feedback-label').style.color='#ff4444';
    PH.playError&&PH.playError();
    updateLives();
    if(lives<=0){ setTimeout(endQuiz,1000); return; }
  }
  
  document.getElementById('score-disp').textContent=score;
  document.getElementById('streak-disp').textContent=streak;
  document.getElementById('streak-fill').style.width=Math.min(streak*10,100)+'%';
  
  // Disable all buttons
  document.querySelectorAll('.answer-opt').forEach(b=>b.disabled=true);
  setTimeout(nextQuestion,800);
}

function timeoutAnswer(){
  if(answering) return;
  answering=true;
  lives--; streak=0; wrongCount++;
  document.querySelectorAll('.answer-opt').forEach(b=>{ if(+b.textContent===currentAnswer) b.classList.add('correct'); b.disabled=true; });
  document.getElementById('question-box').classList.add('wrong-flash');
  document.getElementById('feedback-label').textContent='⏰ TIME UP! ANS: '+currentAnswer;
  document.getElementById('feedback-label').style.color='#ff6600';
  PH.playError&&PH.playError();
  updateLives();
  document.getElementById('streak-fill').style.width='0%';
  if(lives<=0){ setTimeout(endQuiz,1000); return; }
  setTimeout(nextQuestion,1000);
}

function updateLives(){
  document.getElementById('lives-disp').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
}

function endQuiz(){
  clearInterval(qTimer);
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-end').classList.remove('hidden');
  const isNew=PH.setHighScore('math-quiz',score);
  document.getElementById('end-title').textContent=lives>0?'🏆 QUIZ DONE!':'💀 GAME OVER!';
  document.getElementById('end-score').textContent=score+' PTS';
  document.getElementById('end-correct').textContent=correctCount;
  document.getElementById('end-wrong').textContent=wrongCount;
  document.getElementById('end-maxstreak').textContent=maxStreak;
  document.getElementById('end-msg').textContent=`${correctCount}/${TOTAL_Q} correct!${isNew?' 🏆 NEW HIGH SCORE!':''}`;
  document.getElementById('nav-best').textContent=PH.getHighScore('math-quiz');
  if(correctCount>=15) PH.confetti&&PH.confetti();
  if(lives>0) PH.playWin&&PH.playWin(); else PH.playLose&&PH.playLose();
}

document.querySelectorAll('.diff-math-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.diff-math-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    PH.playClick&&PH.playClick();
  });
});

document.getElementById('best-display').textContent=PH.getHighScore('math-quiz');
document.getElementById('nav-best').textContent=PH.getHighScore('math-quiz');
</script>
</body>
</html>
