<!-- NEW -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matching Colors - PixelHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .mc-wrap{max-width:560px;margin:0 auto;padding:20px;text-align:center;}
    .target-display{width:120px;height:120px;border-radius:4px;margin:16px auto;border:4px solid #fff;box-shadow:0 0 30px currentColor;transition:all 0.3s;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:9px;color:rgba(255,255,255,0.6);}
    .color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:0 auto;}
    .color-option{width:100%;padding-top:100%;position:relative;border:3px solid transparent;cursor:pointer;transition:all 0.2s;border-radius:4px;}
    .color-option:hover{transform:scale(1.08);border-color:rgba(255,255,255,0.6);}
    .color-option.correct{border-color:#00ff88;box-shadow:0 0 20px #00ff88;animation:correctPop 0.3s ease;}
    .color-option.wrong{border-color:#ff4444;box-shadow:0 0 20px #ff4444;animation:wrongShake 0.3s ease;}
    @keyframes correctPop{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}
    @keyframes wrongShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
    .mc-info{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
    .mc-stat{font-family:'Press Start 2P',monospace;font-size:10px;color:#aac;}
    .mc-stat span{color:#ffff00;text-shadow:0 0 6px #ffff00;}
    .timer-bar{height:8px;background:rgba(255,255,255,0.1);margin-bottom:16px;border:1px solid #333;max-width:400px;margin-left:auto;margin-right:auto;}
    #mc-timer-fill{height:100%;background:linear-gradient(90deg,#ff00ff,#00ffff);transition:width 0.1s linear;width:100%;}
    .target-label{font-family:'Press Start 2P',monospace;font-size:9px;color:#aac;letter-spacing:2px;margin-bottom:4px;}
    .target-name{font-family:'Press Start 2P',monospace;font-size:12px;color:#fff;letter-spacing:3px;margin-bottom:12px;min-height:20px;}
    .mode-row{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
    .m-btn{font-family:'Press Start 2P',monospace;font-size:7px;padding:8px 14px;border:2px solid #333;color:#555;background:transparent;cursor:pointer;transition:all 0.2s;}
    .m-btn.active,.m-btn:hover{border-color:#ff00ff;color:#ff00ff;}
    .streak-badge{font-family:'Press Start 2P',monospace;font-size:9px;color:#ff00ff;text-shadow:0 0 10px #ff00ff;margin-bottom:8px;min-height:20px;}
  </style>
</head>
<body data-game="match-colors">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">🎨 MATCH COLORS</span>
    <button class="sound-btn" id="sound-toggle">🔊</button>
  </nav>

  <div id="screen-start" class="game-screen">
    <div class="card" style="max-width:480px;margin:40px auto;padding:30px;text-align:center;">
      <h1 style="font-family:'Press Start 2P',monospace;font-size:16px;color:#ff00ff;text-shadow:0 0 20px #ff00ff;margin-bottom:16px;">🎨 MATCH COLORS</h1>
      <p style="font-family:'Share Tech Mono',monospace;color:#aac;line-height:1.7;margin-bottom:24px;">Match the target color from the grid!<br>Race against the timer — streaks score big!</p>
      <div class="mode-row">
        <button class="m-btn active" id="mode-easy" onclick="setMode('easy',this)">EASY</button>
        <button class="m-btn" id="mode-hard" onclick="setMode('hard',this)">HARD</button>
        <button class="m-btn" id="mode-name" onclick="setMode('name',this)">NAME</button>
      </div>
      <div style="text-align:center;margin-bottom:20px;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#ffff00;text-shadow:0 0 10px #ffff00;" id="best-mc">0</span><br><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">BEST SCORE</span></div>
      <button style="font-family:'Press Start 2P',monospace;font-size:12px;padding:16px 32px;border:3px solid #ff00ff;color:#ff00ff;background:transparent;cursor:pointer;width:100%;letter-spacing:3px;" onclick="startGame()">▶ MATCH!</button>
    </div>
  </div>

  <div id="screen-game" class="game-screen hidden">
    <div class="mc-wrap">
      <div class="mc-info">
        <div class="mc-stat">SCORE: <span id="mc-score">0</span></div>
        <div class="mc-stat">ROUND: <span id="mc-round">1</span>/20</div>
        <div class="mc-stat">TIME: <span id="mc-time">5</span>s</div>
      </div>
      <div class="timer-bar"><div id="mc-timer-fill"></div></div>
      <div class="target-label">▸ FIND THIS COLOR:</div>
      <div class="target-name" id="target-name"></div>
      <div class="target-display" id="target-display"></div>
      <div class="streak-badge" id="streak-badge"></div>
      <div class="color-grid" id="color-grid"></div>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden">
    <div class="card" style="max-width:400px;margin:40px auto;padding:30px;text-align:center;">
      <h2 style="font-family:'Press Start 2P',monospace;font-size:16px;color:#ff00ff;text-shadow:0 0 15px #ff00ff;margin-bottom:16px;">DONE!</h2>
      <div style="display:flex;gap:20px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;">
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#ffff00;text-shadow:0 0 12px #ffff00;display:block;" id="final-mc-score">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">SCORE</span></div>
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#00ff88;text-shadow:0 0 12px #00ff88;display:block;" id="final-mc-correct">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">CORRECT</span></div>
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#ff00ff;text-shadow:0 0 12px #ff00ff;display:block;" id="final-mc-streak">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">BEST STREAK</span></div>
      </div>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px;border:2px solid #ff00ff;color:#ff00ff;background:transparent;cursor:pointer;width:100%;margin-bottom:8px;" onclick="startGame()">▶ PLAY AGAIN</button>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px;border:2px solid #555;color:#555;background:transparent;cursor:pointer;width:100%;" onclick="PH.showScreen('screen-start')">MENU</button>
    </div>
  </div>
</div>
<audio id="bg-music" loop><source src="../assets/music/arcade.mp3" type="audio/mpeg"></audio>
<audio id="sfx-click" src="../assets/sounds/click.mp3" preload="auto"></audio>
<audio id="sfx-win" src="../assets/sounds/win.mp3" preload="auto"></audio>
<audio id="sfx-lose" src="../assets/sounds/lose.mp3" preload="auto"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>
<script>
(function(){
  'use strict';
  const NAMED_COLORS=[
    {name:'CRIMSON',hex:'#dc143c'},{name:'COBALT',hex:'#0047ab'},{name:'JADE',hex:'#00a86b'},
    {name:'AMBER',hex:'#ffbf00'},{name:'VIOLET',hex:'#7f00ff'},{name:'CORAL',hex:'#ff6b6b'},
    {name:'TEAL',hex:'#008080'},{name:'SCARLET',hex:'#ff2400'},{name:'INDIGO',hex:'#4b0082'},
    {name:'LIME',hex:'#32cd32'},{name:'MAGENTA',hex:'#ff00ff'},{name:'CYAN',hex:'#00ffff'},
    {name:'ORANGE',hex:'#ff8c00'},{name:'PINK',hex:'#ff69b4'},{name:'GOLD',hex:'#ffd700'},
    {name:'MAROON',hex:'#800000'},{name:'NAVY',hex:'#001f5b'},{name:'OLIVE',hex:'#808000'},
    {name:'SILVER',hex:'#c0c0c0'},{name:'PURPLE',hex:'#9b30ff'},
  ];
  let mode='easy',score,round,streak,bestStreak,correct,timer,timeLimit;
  let targetColor,options,timerInterval,answered;

  window.setMode=function(m,el){
    mode=m;
    document.querySelectorAll('.m-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active');
  };

  function getTimeLimit(){ return {easy:5,hard:3,name:4}[mode]; }

  function buildRound(){
    const shuffled=[...NAMED_COLORS].sort(()=>Math.random()-.5);
    targetColor=shuffled[0];
    // pick 3 decoys ensuring uniqueness
    const decoys=shuffled.slice(1,15).sort(()=>Math.random()-.5).slice(0,15);
    // for hard mode: pick similar hue colors
    let pool;
    if(mode==='hard'){
      // make similar looking colors
      const decoy_hard=[];
      for(let i=0;i<15;i++){
        const h=parseInt(targetColor.hex.slice(1),16);
        const variant='#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
        decoy_hard.push({name:'?',hex:variant});
      }
      pool=[targetColor,...decoy_hard.slice(0,15)].sort(()=>Math.random()-.5);
    } else {
      pool=[targetColor,...decoys].sort(()=>Math.random()-.5);
    }
    options=pool.slice(0,16);
    if(!options.includes(targetColor)){ options[Math.floor(Math.random()*16)]=targetColor; }
    answered=false;
  }

  function startTimer(){
    timeLimit=getTimeLimit(); let t=timeLimit;
    document.getElementById('mc-time').textContent=t;
    document.getElementById('mc-timer-fill').style.width='100%';
    clearInterval(timerInterval);
    timerInterval=setInterval(()=>{
      t-=0.1;
      document.getElementById('mc-time').textContent=Math.ceil(t);
      document.getElementById('mc-timer-fill').style.width=(t/timeLimit*100)+'%';
      if(t<=0){ clearInterval(timerInterval); if(!answered){ answered=true; streak=0; updateStreak(); nextRound(false); } }
    },100);
  }

  function renderRound(){
    buildRound();
    const td=document.getElementById('target-display');
    if(mode==='hard'){
      // Show color swatch only (no name)
      td.style.backgroundColor=targetColor.hex;
      td.style.boxShadow=`0 0 30px ${targetColor.hex}`;
      td.textContent='';
      document.getElementById('target-name').textContent='';
    } else if(mode==='name'){
      // Show only name, no color
      td.style.backgroundColor='#1a0040';
      td.style.boxShadow='none';
      td.textContent='';
      document.getElementById('target-name').textContent=targetColor.name;
    } else {
      td.style.backgroundColor=targetColor.hex;
      td.style.boxShadow=`0 0 30px ${targetColor.hex}`;
      td.textContent='';
      document.getElementById('target-name').textContent=targetColor.name;
    }
    const grid=document.getElementById('color-grid'); grid.innerHTML='';
    options.forEach(opt=>{
      const div=document.createElement('div');
      div.className='color-option';
      div.style.backgroundColor=mode==='name'?opt.hex:(opt.hex);
      div.style.boxShadow=`0 0 8px ${opt.hex}`;
      if(mode==='name') div.title=opt.name;
      div.onclick=()=>handlePick(div,opt);
      grid.appendChild(div);
    });
    document.getElementById('mc-round').textContent=round;
    startTimer();
  }

  function handlePick(el,opt){
    if(answered) return;
    answered=true; clearInterval(timerInterval);
    const isCorrect=opt.hex===targetColor.hex||(mode==='name'&&opt.name===targetColor.name);
    if(isCorrect){
      el.classList.add('correct');
      const timeBonus=Math.floor(document.getElementById('mc-time').textContent)*5;
      const streakBonus=streak*10;
      score+=100+timeBonus+streakBonus; correct++; streak++; bestStreak=Math.max(bestStreak,streak);
      document.getElementById('mc-score').textContent=score;
      if(typeof PH!=='undefined'&&PH.playWin) PH.playWin();
    } else {
      el.classList.add('wrong');
      // highlight correct
      document.querySelectorAll('.color-option').forEach((d,i)=>{
        if(options[i].hex===targetColor.hex) d.classList.add('correct');
      });
      streak=0;
      if(typeof PH!=='undefined'&&PH.playLose) PH.playLose();
    }
    updateStreak();
    setTimeout(()=>nextRound(isCorrect),600);
  }

  function updateStreak(){
    const sb=document.getElementById('streak-badge');
    sb.textContent=streak>=3?('🔥 '+streak+'x STREAK BONUS!'):'';
  }

  function nextRound(){ round++; if(round>20){ endGame(); return; } renderRound(); }

  function endGame(){
    clearInterval(timerInterval);
    const best=Math.max(score,parseInt(localStorage.getItem('mc_best')||'0'));
    localStorage.setItem('mc_best',best);
    document.getElementById('final-mc-score').textContent=score;
    document.getElementById('final-mc-correct').textContent=correct;
    document.getElementById('final-mc-streak').textContent=bestStreak;
    if(typeof PH!=='undefined'){ PH.submitScore('match-colors',score); PH.showScreen('screen-end'); if(correct>=15) PH.confetti&&PH.confetti(); }
  }

  window.startGame=function(){
    score=0; round=1; streak=0; bestStreak=0; correct=0;
    document.getElementById('mc-score').textContent=0;
    document.getElementById('streak-badge').textContent='';
    const best=localStorage.getItem('mc_best')||0;
    document.getElementById('best-mc').textContent=best;
    if(typeof PH!=='undefined') PH.showScreen('screen-game');
    renderRound();
  };

  document.getElementById('best-mc').textContent=localStorage.getItem('mc_best')||0;
  if(typeof PH!=='undefined') PH.initGamePage();
})();
</script>
</body>
</html>
