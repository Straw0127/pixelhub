<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodge the Blocks - PixelHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .dodge-wrap{max-width:560px;margin:0 auto;padding:20px;text-align:center;}
    #dodge-canvas{border:3px solid #ff6600;box-shadow:0 0 20px rgba(255,102,0,0.4);display:block;margin:0 auto;}
    .dg-info{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
    .dg-stat{font-family:'Press Start 2P',monospace;font-size:10px;color:#aac;}
    .dg-stat span{color:#ffff00;text-shadow:0 0 6px #ffff00;}
    .mobile-controls{display:flex;gap:12px;justify-content:center;margin-top:12px;}
    .m-btn{font-family:'Press Start 2P',monospace;font-size:18px;padding:14px 24px;border:2px solid #333;color:#00ffff;background:rgba(0,0,20,0.8);cursor:pointer;transition:all 0.1s;-webkit-tap-highlight-color:transparent;}
    .m-btn:active{background:rgba(0,255,255,0.15);border-color:#00ffff;}
  </style>
</head>
<body data-game="dodge-blocks">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">⚡ DODGE BLOCKS</span>
    <button class="sound-btn" id="sound-toggle">🔊</button>
  </nav>

  <div id="screen-start" class="game-screen">
    <div class="card" style="max-width:440px;margin:40px auto;padding:30px;text-align:center;">
      <h1 style="font-family:'Press Start 2P',monospace;font-size:16px;color:#ff6600;text-shadow:0 0 20px #ff6600;margin-bottom:16px;">⚡ DODGE BLOCKS</h1>
      <p style="font-family:'Share Tech Mono',monospace;color:#aac;line-height:1.7;margin-bottom:24px;">Survive as long as possible!<br>Move left/right to dodge blocks.<br>Speed increases over time!</p>
      <div style="text-align:center;margin-bottom:20px;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#ffff00;text-shadow:0 0 10px #ffff00;" id="best-dodge">0</span><br><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">BEST SCORE</span></div>
      <button style="font-family:'Press Start 2P',monospace;font-size:12px;padding:16px 32px;border:3px solid #ff6600;color:#ff6600;background:transparent;cursor:pointer;width:100%;letter-spacing:3px;" onclick="startGame()">▶ DODGE!</button>
    </div>
  </div>

  <div id="screen-game" class="game-screen hidden">
    <div class="dodge-wrap">
      <div class="dg-info">
        <div class="dg-stat">SCORE: <span id="dg-score">0</span></div>
        <div class="dg-stat">BEST: <span id="dg-best">0</span></div>
        <div class="dg-stat">SPEED: <span id="dg-speed">1x</span></div>
      </div>
      <canvas id="dodge-canvas" width="400" height="500"></canvas>
      <div class="mobile-controls">
        <button class="m-btn" id="btn-left">◀</button>
        <button class="m-btn" id="btn-right">▶</button>
      </div>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden">
    <div class="card" style="max-width:400px;margin:40px auto;padding:30px;text-align:center;">
      <h2 style="font-family:'Press Start 2P',monospace;font-size:16px;color:#ff6600;text-shadow:0 0 15px #ff6600;margin-bottom:16px;">SMASHED!</h2>
      <div style="display:flex;gap:20px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;">
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#ffff00;text-shadow:0 0 12px #ffff00;display:block;" id="final-dg-score">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">SCORE</span></div>
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#00ff88;text-shadow:0 0 12px #00ff88;display:block;" id="final-dg-best">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">BEST</span></div>
      </div>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px;border:2px solid #ff6600;color:#ff6600;background:transparent;cursor:pointer;width:100%;margin-bottom:8px;" onclick="startGame()">▶ DODGE AGAIN</button>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px;border:2px solid #555;color:#555;background:transparent;cursor:pointer;width:100%;" onclick="PH.showScreen('screen-start')">MENU</button>
    </div>
  </div>
</div>
<audio id="bg-music" loop><source src="../assets/music/arcade.mp3" type="audio/mpeg"></audio>
<audio id="sfx-click" src="../assets/sounds/click.mp3" preload="auto"></audio>
<audio id="sfx-win" src="../assets/sounds/win.mp3" preload="auto"></audio>
<audio id="sfx-lose" src="../assets/sounds/lose.mp3" preload="auto"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>
<script>
(function(){
  'use strict';
  const W=400,H=500,PW=30,PH=30,LANE_W=80;
  const LANES=[40,120,200,280,360];
  let player,blocks,score,frame,raf,gameOver,keys,speed;
  let targetLane,currentX,particles=[];

  const BCOLS=['#ff2244','#ff6600','#ffaa00','#ff4400','#ff0088'];

  function draw(){
    const canvas=document.getElementById('dodge-canvas');
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#080018'; ctx.fillRect(0,0,W,H);
    // lane lines
    LANES.forEach((lx,i)=>{
      ctx.strokeStyle='rgba(255,102,0,0.08)'; ctx.lineWidth=1;
      ctx.setLineDash([10,8]);
      ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,H); ctx.stroke();
      ctx.setLineDash([]);
    });
    // particles
    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--;
      if(p.life>0){ ctx.fillStyle=p.color; ctx.globalAlpha=p.life/p.ml; ctx.fillRect(p.x,p.y,p.s,p.s); ctx.globalAlpha=1; }
    });
    particles=particles.filter(p=>p.life>0);
    // blocks
    blocks.forEach(b=>{
      ctx.shadowBlur=10; ctx.shadowColor=b.color;
      ctx.fillStyle=b.color;
      ctx.fillRect(b.x-LANE_W/2+5,b.y,LANE_W-10,36);
      ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.fillRect(b.x-LANE_W/2+5,b.y,LANE_W-10,6);
      ctx.shadowBlur=0;
    });
    // player
    ctx.shadowBlur=15; ctx.shadowColor='#00ffff';
    ctx.fillStyle='#00ffff';
    ctx.fillRect(currentX-PW/2,H-80,PW,PH);
    ctx.fillStyle='#0088cc';
    ctx.fillRect(currentX-PW/2+4,H-80+PH,8,10);
    ctx.fillRect(currentX+PW/2-12,H-80+PH,8,10);
    ctx.fillStyle='#000';
    ctx.fillRect(currentX+PW/2-10,H-80+6,8,8);
    ctx.shadowBlur=0;
  }

  function update(){
    if(gameOver) return;
    frame++;
    speed=3+score/300;
    if(frame%6===0){score++;document.getElementById('dg-score').textContent=score;document.getElementById('dg-speed').textContent=(Math.floor(speed*10)/10)+'x';}
    // smooth player movement
    currentX+=(LANES[targetLane]-currentX)*0.2;
    // spawn
    if(frame%(Math.max(20,50-Math.floor(speed*5)))===0){
      const laneIdx=Math.floor(Math.random()*LANES.length);
      blocks.push({x:LANES[laneIdx],y:-40,color:BCOLS[Math.floor(Math.random()*BCOLS.length)],laneIdx});
    }
    blocks.forEach(b=>b.y+=speed*1.4);
    // collision
    for(const b of blocks){
      if(Math.abs(b.x-currentX)<LANE_W/2-6&&b.y+36>H-80&&b.y<H-80+PH){
        for(let i=0;i<20;i++) particles.push({x:currentX,y:H-80,vx:(Math.random()-0.5)*12,vy:-3-Math.random()*8,life:25,ml:25,color:b.color,s:5});
        gameOver=true; cancelAnimationFrame(raf);
        if(typeof PH!=='undefined'&&PH.playLose) PH.playLose();
        setTimeout(endGame,500); return;
      }
    }
    blocks=blocks.filter(b=>b.y<H+50);
    draw();
    raf=requestAnimationFrame(update);
  }

  function endGame(){
    const best=Math.max(score,parseInt(localStorage.getItem('dodge_best')||'0'));
    localStorage.setItem('dodge_best',best);
    document.getElementById('final-dg-score').textContent=score;
    document.getElementById('final-dg-best').textContent=best;
    if(typeof PH!=='undefined'){ PH.submitScore('dodge-blocks',score); PH.showScreen('screen-end'); }
  }

  document.addEventListener('keydown',e=>{
    if(!gameOver){
      if(e.key==='ArrowLeft'||e.key==='a') targetLane=Math.max(0,targetLane-1);
      if(e.key==='ArrowRight'||e.key==='d') targetLane=Math.min(LANES.length-1,targetLane+1);
    }
  });

  window.startGame=function(){
    blocks=[]; score=0; frame=0; gameOver=false; speed=3; particles=[];
    targetLane=2; currentX=LANES[2];
    player={lane:2};
    cancelAnimationFrame(raf);
    const best=localStorage.getItem('dodge_best')||0;
    document.getElementById('dg-score').textContent=0;
    document.getElementById('dg-best').textContent=best;
    document.getElementById('dg-speed').textContent='1x';
    document.getElementById('best-dodge').textContent=best;
    if(typeof PH!=='undefined') PH.showScreen('screen-game');
    document.getElementById('btn-left').addEventListener('touchstart',e=>{e.preventDefault();if(!gameOver)targetLane=Math.max(0,targetLane-1);},{passive:false});
    document.getElementById('btn-right').addEventListener('touchstart',e=>{e.preventDefault();if(!gameOver)targetLane=Math.min(LANES.length-1,targetLane+1);},{passive:false});
    document.getElementById('btn-left').onclick=()=>{if(!gameOver)targetLane=Math.max(0,targetLane-1);};
    document.getElementById('btn-right').onclick=()=>{if(!gameOver)targetLane=Math.min(LANES.length-1,targetLane+1);};
    raf=requestAnimationFrame(update);
  };

  document.getElementById('best-dodge').textContent=localStorage.getItem('dodge_best')||0;
  if(typeof PH!=='undefined') PH.initGamePage();
})();
</script>
</body>
</html>
