<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Cards - SkyWorld</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .mem-wrap { display:flex; flex-direction:column; align-items:center; padding:12px; gap:10px; }
    .mem-grid { display:grid; gap:6px; justify-content:center; }
    .mem-grid.grid-4  { grid-template-columns:repeat(4,1fr); }
    .mem-grid.grid-5  { grid-template-columns:repeat(5,1fr); }
    .mem-grid.grid-6  { grid-template-columns:repeat(6,1fr); }
    .mem-grid.grid-7  { grid-template-columns:repeat(7,1fr); }
    .mem-card { width:min(72px,13vw); height:min(72px,13vw); perspective:600px; cursor:pointer; }
    .mem-card-inner { width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 0.45s cubic-bezier(0.4,0,0.2,1); }
    .mem-card.flipped .mem-card-inner { transform:rotateY(180deg); }
    .mem-card.matched .mem-card-inner { transform:rotateY(180deg); }
    .mem-card.matched .card-front { background:rgba(165,214,167,0.25); border-color:#a5d6a7; box-shadow:0 0 12px rgba(165,214,167,0.35); }
    .card-front,.card-back { position:absolute; width:100%; height:100%; backface-visibility:hidden; display:flex; align-items:center; justify-content:center; border:2px solid; border-radius:8px; }
    .card-back { background:rgba(21,101,192,0.55); border-color:rgba(255,255,255,0.45); backdrop-filter:blur(4px); }
    .card-back::after { content:'?'; font-family:'Fredoka One',cursive; font-size:min(18px,3vw); color:rgba(255,255,255,0.6); }
    .card-front { background:rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.55); transform:rotateY(180deg); font-size:min(32px,6vw); backdrop-filter:blur(4px); }
    .mem-card:not(.matched):not(.flipped):hover .card-back { border-color:#81d4fa; box-shadow:0 4px 12px rgba(129,212,250,0.25); }
    .mem-stats { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
    .mem-stat { text-align:center; font-family:'Fredoka One',cursive; font-size:9px; }
    .mem-stat-num { font-size:20px; display:block; color:#81d4fa; text-shadow:0 2px 8px rgba(129,212,250,0.35); }
    .mem-stat span { color:rgba(255,255,255,0.6); display:block; margin-top:4px; }
    .diff-sel { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .diff-card { font-family:'Fredoka One',cursive; font-size:8px; padding:10px 14px; border:2px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.06); cursor:pointer; transition:all 0.2s; border-radius:20px; }
    .diff-card.active { border-color:#81d4fa; color:#81d4fa; background:rgba(129,212,250,0.1); box-shadow:0 2px 10px rgba(129,212,250,0.2); }
    #timer-display { font-family:'Fredoka One',cursive; font-size:20px; }
    .timer-warn { color:#ff6600 !important; animation:blink 0.5s step-end infinite; }
    @keyframes blink{50%{opacity:0.3}}
    .progress-track { width:min(400px,90vw); height:5px; background:rgba(255,255,255,0.12); border-radius:3px; }
    .progress-fill { height:100%; background:linear-gradient(90deg,#1e88e5,#81d4fa); border-radius:3px; transition:width 1s linear; }
  </style>
</head>
<body data-game="memory">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">🃏 MEMORY CARDS</span>
    <span class="score-display">BEST: <span id="nav-best">0</span></span>
  </nav>

  <div id="screen-start" class="game-screen" style="position:relative;max-width:460px;margin:30px auto;">
    <h1>🃏 MEMORY CARDS</h1>
    <p>Flip cards to find matching pairs. Remember positions and match them all!</p>
    <div style="margin:20px 0;">
      <div style="font-family:'Fredoka One',cursive;font-size:9px;color:rgba(255,255,255,0.6);margin-bottom:12px;letter-spacing:2px;">SELECT DIFFICULTY:</div>
      <div class="diff-sel">
        <button class="diff-card active" data-pairs="10" data-time="120">EASY<br><span style="font-size:7px;color:rgba(255,255,255,0.6)">10 PAIRS · 2 MIN</span></button>
        <button class="diff-card" data-pairs="15" data-time="105">MEDIUM<br><span style="font-size:7px;color:rgba(255,255,255,0.6)">15 PAIRS · 1:45</span></button>
        <button class="diff-card" data-pairs="21" data-time="120">HARD<br><span style="font-size:7px;color:rgba(255,255,255,0.6)">21 PAIRS · 2 MIN</span></button>
      </div>
    </div>
    <button class="pixel-btn btn-cyan mt-16" onclick="startMemory()"><span class="btn-span">▶ START GAME</span></button>
    <div style="margin-top:12px;font-family:'Fredoka One',cursive;font-size:9px;color:rgba(255,255,255,0.6)">HIGH SCORE: <span id="best-display" class="neon-cyan">0</span></div>
  </div>

  <div id="screen-game" class="hidden">
    <div class="mem-wrap">
      <div class="mem-stats">
        <div class="mem-stat"><span class="mem-stat-num" id="moves-disp">0</span><span>MOVES</span></div>
        <div class="mem-stat"><span class="mem-stat-num neon-green" id="matches-disp">0</span><span>MATCHED</span></div>
        <div class="mem-stat"><span class="mem-stat-num" id="timer-display" style="color:#ffd54f">120</span><span>SECONDS</span></div>
        <div class="mem-stat"><span class="mem-stat-num" id="pairs-left-disp" style="color:#f8bbd0">0</span><span>REMAINING</span></div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="timer-bar" style="width:100%"></div></div>
      <div class="mem-grid" id="mem-grid"></div>
      <button class="pixel-btn btn-cyan" onclick="startMemory()"><span class="btn-span">↺ RESTART</span></button>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden" style="position:relative;max-width:440px;margin:40px auto;">
    <h1 id="end-title">🎉 YOU WIN!</h1>
    <span class="final-score" id="end-score">0</span>
    <p id="end-msg"></p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
      <button class="pixel-btn btn-cyan" onclick="startMemory()"><span class="btn-span">▶ PLAY AGAIN</span></button>
      <a href="../index.html" class="pixel-btn btn-green"><span class="btn-span">◀ MENU</span></a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>
<script>
// 30 distinct emojis for up to 21 pairs (hard mode)
const EMOJIS=['🎮','🕹️','👾','🚀','⭐','🔥','💎','🌈','🎯','🏆',
              '⚡','🎲','🌙','🎪','🦄','🎭','🍕','🎸','🦊','🐉',
              '🌺','🎨','🦋','🍦','🎃','🎵','🌊','🦅','🎀','🍀'];
let cards=[], flipped=[], matched=0, moves=0, totalPairs=10, timeLeft=120, maxTime=120, timer=null, canFlip=true;

function startMemory(){
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-end').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');

  const active=document.querySelector('.diff-card.active');
  totalPairs=parseInt(active.dataset.pairs);
  maxTime=parseInt(active.dataset.time);
  timeLeft=maxTime;
  moves=0; matched=0; flipped=[]; canFlip=true;

  document.getElementById('moves-disp').textContent=0;
  document.getElementById('matches-disp').textContent=0;
  document.getElementById('pairs-left-disp').textContent=totalPairs;
  document.getElementById('timer-display').textContent=timeLeft;
  document.getElementById('timer-display').className='mem-stat-num';
  document.getElementById('timer-bar').style.width='100%';

  const chosen=PH.shuffle([...EMOJIS]).slice(0,totalPairs);
  cards=PH.shuffle([...chosen,...chosen].map((e,i)=>({id:i,emoji:e,flipped:false,matched:false})));

  const grid=document.getElementById('mem-grid');
  // Grid columns: easy=5, medium=6, hard=7
  const cols=totalPairs<=10?5:totalPairs<=15?6:7;
  grid.className='mem-grid grid-'+cols;
  renderCards();

  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft--;
    const td=document.getElementById('timer-display');
    td.textContent=timeLeft;
    document.getElementById('timer-bar').style.width=Math.max(0,(timeLeft/maxTime)*100)+'%';
    if(timeLeft<=20) td.classList.add('timer-warn');
    if(timeLeft<=0){ clearInterval(timer); endGame(false); }
  },1000);

  PH.playClick&&PH.playClick();
}

function renderCards(){
  const grid=document.getElementById('mem-grid');
  grid.innerHTML='';
  cards.forEach((card,i)=>{
    const el=document.createElement('div');
    el.className='mem-card'+(card.flipped?' flipped':'')+(card.matched?' matched':'');
    el.innerHTML=`<div class="mem-card-inner"><div class="card-back"></div><div class="card-front">${card.emoji}</div></div>`;
    el.addEventListener('click',()=>flipCard(i));
    grid.appendChild(el);
  });
}

function flipCard(i){
  if(!canFlip||cards[i].flipped||cards[i].matched||flipped.length>=2) return;
  cards[i].flipped=true;
  flipped.push(i);
  PH.playBeep&&PH.playBeep(660,0.08,'sine',0.1);
  const els=document.querySelectorAll('.mem-card');
  els[i].classList.add('flipped');
  if(flipped.length===2){
    moves++;
    document.getElementById('moves-disp').textContent=moves;
    canFlip=false;
    checkMatch();
  }
}

function checkMatch(){
  const [a,b]=flipped;
  if(cards[a].emoji===cards[b].emoji){
    cards[a].matched=cards[b].matched=true;
    matched++;
    document.getElementById('matches-disp').textContent=matched;
    document.getElementById('pairs-left-disp').textContent=totalPairs-matched;
    PH.playBeep&&PH.playBeep(880,0.1,'sine',0.12);
    const els=document.querySelectorAll('.mem-card');
    els[a].classList.add('matched');
    els[b].classList.add('matched');
    flipped=[]; canFlip=true;
    if(matched===totalPairs){ clearInterval(timer); setTimeout(()=>endGame(true),400); }
  } else {
    setTimeout(()=>{
      const els=document.querySelectorAll('.mem-card');
      cards[a].flipped=cards[b].flipped=false;
      els[a].classList.remove('flipped');
      els[b].classList.remove('flipped');
      PH.playBeep&&PH.playBeep(220,0.12,'sawtooth',0.08);
      flipped=[]; canFlip=true;
    },900);
  }
}

function endGame(win){
  clearInterval(timer);
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-end').classList.remove('hidden');
  // Score: pairs * 50 - moves penalty + time bonus
  const score=win?Math.max(0,(totalPairs*50)-(moves*3)+(timeLeft*5)):Math.floor(matched*20);
  if(win){
    document.getElementById('end-title').textContent='🎉 YOU WIN!';
    PH.playWin&&PH.playWin();
    PH.confetti&&PH.confetti();
  } else {
    document.getElementById('end-title').textContent='⏰ TIME UP!';
    PH.playLose&&PH.playLose();
  }
  document.getElementById('end-score').textContent=score+' PTS';
  const msg=win?`Matched all ${totalPairs} pairs in ${moves} moves! Time left: ${timeLeft}s`:`Matched ${matched}/${totalPairs} pairs.`;
  const isNew=PH.setHighScore('memory',score);
  document.getElementById('end-msg').textContent=msg+(isNew?' 🏆 NEW HIGH SCORE!':'');
  document.getElementById('nav-best').textContent=PH.getHighScore('memory');
}

document.getElementById('best-display').textContent=PH.getHighScore('memory');
document.getElementById('nav-best').textContent=PH.getHighScore('memory');

document.querySelectorAll('.diff-card').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.diff-card').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    PH.playClick&&PH.playClick();
  });
});
</script>
</body>
</html>
