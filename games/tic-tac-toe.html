<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe - SkyWorld</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .ttt-board { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:min(360px,80vw); height:min(360px,80vw); margin:20px auto; }
    .ttt-cell { background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; font-size:min(70px,14vw); cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; border-radius:10px; }
    .ttt-cell:hover:not(.taken) { background:rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.6); box-shadow:inset 0 0 14px rgba(255,255,255,0.1); }
    .ttt-cell.x-cell { color:#81d4fa; text-shadow:0 2px 8px rgba(129,212,250,0.5); border-color:#81d4fa; }
    .ttt-cell.o-cell { color:#f8bbd0; text-shadow:0 2px 8px rgba(248,187,208,0.5); border-color:rgba(248,187,208,0.7); }
    .ttt-cell.winner { background:rgba(255,213,79,0.15) !important; border-color:#ffd54f !important; animation:winCellPulse 0.5s ease infinite alternate; }
    @keyframes winCellPulse { from{box-shadow:inset 0 0 10px rgba(255,213,79,0.2);} to{box-shadow:inset 0 0 30px rgba(255,213,79,0.5);} }
    .ttt-cell.pop { animation:cellPop 0.2s cubic-bezier(0.175,0.885,0.32,1.275); }
    @keyframes cellPop { 0%{transform:scale(0.5);opacity:0} 100%{transform:scale(1);opacity:1} }
    .score-board { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; width:min(360px,80vw); margin:10px auto; }
    .score-box { text-align:center; padding:12px; border:2px solid; background:rgba(255,255,255,0.1); border-radius:10px; backdrop-filter:blur(4px); }
    .score-box.x-box { border-color:rgba(129,212,250,0.7); }
    .score-box.o-box { border-color:rgba(248,187,208,0.7); }
    .score-num { font-family:'Fredoka One',cursive; font-size:24px; display:block; }
    .score-box.x-box .score-num { color:#81d4fa; }
    .score-box.o-box .score-num { color:#f8bbd0; }
    .score-lbl { font-size:9px; color:rgba(255,255,255,0.6); font-family:'Fredoka One',cursive; letter-spacing:1px; display:block; margin-top:4px; }
    .mode-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .mode-btn { font-family:'Fredoka One',cursive; font-size:8px; padding:10px 18px; border:2px solid rgba(255,255,255,0.25); color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.08); cursor:pointer; transition:all 0.2s; border-radius:22px; }
    .mode-btn.active { border-color:rgba(248,187,208,0.8); color:#f8bbd0; background:rgba(248,187,208,0.12); }
    .diff-btns { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .diff-btn { font-family:'Fredoka One',cursive; font-size:7px; padding:8px 14px; border:2px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.06); cursor:pointer; transition:all 0.2s; border-radius:20px; }
    .diff-btn.active { border-color:#a5d6a7; color:#a5d6a7; background:rgba(165,214,167,0.1); }
    .turn-bar { font-family:'Fredoka One',cursive; font-size:11px; letter-spacing:2px; height:30px; text-align:center; }
    .draw-box { border-color:rgba(255,255,255,0.4); }
    .draw-box .score-num { color:rgba(255,255,255,0.5); }
  </style>
</head>
<body data-game="tic-tac-toe">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">⭕ TIC-TAC-TOE</span>
    <button class="sound-btn" id="sound-toggle">🔊</button>
  </nav>

  <div id="screen-start" class="game-screen" style="position:relative;max-width:420px;margin:40px auto;">
    <h1>⭕ TIC-TAC-TOE</h1>
    <p>Classic X vs O. Get 3 in a row to win!</p>
    <div style="margin:20px 0;">
      <div style="font-family:'Fredoka One',cursive;font-size:9px;color:rgba(255,255,255,0.6);margin-bottom:12px;letter-spacing:2px;">SELECT MODE:</div>
      <div class="mode-btns">
        <button class="mode-btn active" data-mode="ai">VS AI</button>
        <button class="mode-btn" data-mode="pvp">2 PLAYERS</button>
      </div>
    </div>
    <div id="diff-section" style="margin-bottom:20px;">
      <div style="font-family:'Fredoka One',cursive;font-size:9px;color:rgba(255,255,255,0.6);margin-bottom:10px;letter-spacing:2px;">AI DIFFICULTY:</div>
      <div class="diff-btns">
        <button class="diff-btn active" data-diff="easy">😊 EASY</button>
        <button class="diff-btn" data-diff="medium">🤔 MEDIUM</button>
        <button class="diff-btn" data-diff="hard">😈 HARD</button>
      </div>
    </div>
    <button class="pixel-btn btn-magenta" onclick="startGame()"><span class="btn-span">▶ START GAME</span></button>
  </div>

  <div id="screen-game" class="hidden">
    <div style="display:flex;flex-direction:column;align-items:center;padding:20px;gap:8px;">
      <div class="score-board">
        <div class="score-box x-box">
          <span class="score-num" id="score-x">0</span>
          <span class="score-lbl" id="label-x">PLAYER X</span>
        </div>
        <div class="score-box draw-box" style="border-color:rgba(255,255,255,0.35);padding:8px;">
          <span class="score-num" id="score-draw">0</span>
          <span class="score-lbl">DRAW</span>
        </div>
        <div class="score-box o-box">
          <span class="score-num" id="score-o">0</span>
          <span class="score-lbl" id="label-o">AI (O)</span>
        </div>
      </div>
      <div class="turn-bar" id="turn-bar"><span class="neon-cyan">X GOES FIRST</span></div>
      <div class="ttt-board" id="ttt-board"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;">
        <button class="pixel-btn btn-magenta" onclick="resetRound()"><span class="btn-span">↺ NEW ROUND</span></button>
        <button class="pixel-btn btn-cyan" onclick="backToMenu()"><span class="btn-span">≡ MENU</span></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>
<script>
let board=Array(9).fill(null), xTurn=true, gameActive=false;
let scores={x:0,o:0,d:0}, mode='ai', aiTurn=false, difficulty='easy';
const WIN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
// Probability of playing smart move per difficulty
const SMART={easy:0.30, medium:0.60, hard:0.88};

function startGame(){
  mode=document.querySelector('.mode-btn.active').dataset.mode;
  difficulty=(document.querySelector('.diff-btn.active')||{dataset:{diff:'easy'}}).dataset.diff;
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  document.getElementById('label-o').textContent=mode==='ai'?'AI (O)':'PLAYER O';
  scores={x:0,o:0,d:0};
  updateScores();
  resetRound();
}

function backToMenu(){
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-start').classList.remove('hidden');
}

function resetRound(){
  board=Array(9).fill(null);
  xTurn=true; gameActive=true; aiTurn=false;
  renderBoard(); setTurnBar();
}

function renderBoard(){
  const el=document.getElementById('ttt-board');
  el.innerHTML='';
  board.forEach((v,i)=>{
    const cell=document.createElement('div');
    cell.className='ttt-cell'+(v?' taken':'');
    if(v==='X') cell.classList.add('x-cell');
    if(v==='O') cell.classList.add('o-cell');
    cell.textContent=v||'';
    if(v) cell.classList.add('pop');
    cell.addEventListener('click',()=>handleClick(i));
    el.appendChild(cell);
  });
}

function handleClick(i){
  if(!gameActive||board[i]||aiTurn) return;
  board[i]=xTurn?'X':'O';
  PH.playMove&&PH.playMove();
  const cells=document.querySelectorAll('.ttt-cell');
  if(cells[i]){ cells[i].textContent=board[i]; cells[i].classList.add(xTurn?'x-cell':'o-cell','taken','pop'); }
  const w=checkWinner();
  if(w){ endGame(w); return; }
  if(board.every(c=>c)){ endGame(null); return; }
  xTurn=!xTurn; setTurnBar();
  if(mode==='ai'&&!xTurn&&gameActive){
    aiTurn=true;
    setTimeout(()=>{ aiMove(); aiTurn=false; }, 350+Math.random()*350);
  }
}

function aiMove(){
  if(!gameActive) return;
  const empties=board.map((v,i)=>v===null?i:null).filter(i=>i!==null);
  if(!empties.length) return;

  let move;
  if(Math.random()<SMART[difficulty]){
    // Strategic: win > block > center > opposite corner > corner > side
    move = findThreat('O')       // win immediately
        ?? findThreat('X')       // block player
        ?? (board[4]===null?4:null)  // center
        ?? bestCorner()          // best corner
        ?? empties[Math.floor(Math.random()*empties.length)];
  } else {
    // Random move - makes AI beatable
    move=empties[Math.floor(Math.random()*empties.length)];
  }

  board[move]='O';
  xTurn=true;
  PH.playBeep&&PH.playBeep(440,0.08,'square',0.08);
  const cells=document.querySelectorAll('.ttt-cell');
  if(cells[move]){ cells[move].textContent='O'; cells[move].classList.add('o-cell','taken','pop'); }
  const w=checkWinner();
  if(w){ endGame(w); return; }
  if(board.every(c=>c)){ endGame(null); return; }
  setTurnBar();
}

function findThreat(player){
  for(const [a,b,c] of WIN){
    const vals=[board[a],board[b],board[c]];
    const idxs=[a,b,c];
    if(vals.filter(v=>v===player).length===2){
      const empty=idxs.find(i=>board[i]===null);
      if(empty!==undefined) return empty;
    }
  }
  return null;
}

function bestCorner(){
  // Prefer corner opposite to player's corner
  const corners=[0,2,6,8];
  const opp={0:8,2:6,6:2,8:0};
  for(const c of corners){
    if(board[c]==='X'&&board[opp[c]]===null) return opp[c];
  }
  const free=corners.filter(c=>board[c]===null);
  return free.length?free[Math.floor(Math.random()*free.length)]:null;
}

function checkWinner(){
  for(const [a,b,c] of WIN){
    if(board[a]&&board[a]===board[b]&&board[a]===board[c]){
      const cells=document.querySelectorAll('.ttt-cell');
      [a,b,c].forEach(i=>cells[i].classList.add('winner'));
      return board[a];
    }
  }
  return null;
}

function endGame(winner){
  gameActive=false;
  if(winner==='X'){ scores.x++; PH.playWin&&PH.playWin(); PH.confetti&&PH.confetti(); PH.setHighScore&&PH.setHighScore('tic-tac-toe',scores.x); }
  else if(winner==='O'){ scores.o++; if(mode==='ai') PH.playLose&&PH.playLose(); else PH.playWin&&PH.playWin(); }
  else { scores.d++; PH.playBeep&&PH.playBeep(440,0.3,'sine',0.1); }
  updateScores();
  const tb=document.getElementById('turn-bar');
  if(winner) tb.innerHTML=`<span style="color:#ffd54f">${winner} WINS! 🏆</span>`;
  else tb.innerHTML=`<span style="color:rgba(255,255,255,0.5)">DRAW! 🤝</span>`;
  setTimeout(resetRound,2200);
}

function updateScores(){
  document.getElementById('score-x').textContent=scores.x;
  document.getElementById('score-o').textContent=scores.o;
  document.getElementById('score-draw').textContent=scores.d;
}

function setTurnBar(){
  const tb=document.getElementById('turn-bar');
  const who=xTurn?'X':'O';
  const color=xTurn?'#81d4fa':'#f8bbd0';
  const label=mode==='ai'&&!xTurn?'AI THINKING...':'PLAYER '+who+"'S TURN";
  tb.innerHTML=`<span style="color:${color}">${label}</span>`;
}

document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('diff-section').style.display=btn.dataset.mode==='ai'?'block':'none';
    PH.playClick&&PH.playClick();
  });
});

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    PH.playClick&&PH.playClick();
  });
});
</script>
</body>
</html>
