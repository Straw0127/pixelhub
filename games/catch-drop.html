<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Drop - PixelHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .cd-wrap{max-width:560px;margin:0 auto;padding:20px;text-align:center;}
    #cd-canvas{border:3px solid #00ff88;box-shadow:0 0 20px rgba(0,255,136,0.4);display:block;margin:0 auto;cursor:none;}
    .cd-info{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
    .cd-stat{font-family:'Press Start 2P',monospace;font-size:10px;color:#aac;}
    .cd-stat span{color:#ffff00;text-shadow:0 0 6px #ffff00;}
    .cd-hint{font-family:'Press Start 2P',monospace;font-size:8px;color:#555;margin-top:8px;}
  </style>
</head>
<body data-game="catch-drop">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">💧 CATCH THE DROP</span>
    <button class="sound-btn" id="sound-toggle">🔊</button>
  </nav>

  <div id="screen-start" class="game-screen">
    <div class="card" style="max-width:440px;margin:40px auto;padding:30px;text-align:center;">
      <h1 style="font-family:'Press Start 2P',monospace;font-size:16px;color:#00ff88;text-shadow:0 0 20px #00ff88;margin-bottom:16px;">💧 CATCH THE DROP</h1>
      <p style="font-family:'Share Tech Mono',monospace;color:#aac;line-height:1.7;margin-bottom:24px;">Move the bucket to catch falling drops.<br>Miss too many and it's game over!<br>Gold drops worth bonus points!</p>
      <div style="text-align:center;margin-bottom:20px;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#ffff00;text-shadow:0 0 10px #ffff00;" id="best-cd">0</span><br><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">BEST SCORE</span></div>
      <button style="font-family:'Press Start 2P',monospace;font-size:12px;padding:16px 32px;border:3px solid #00ff88;color:#00ff88;background:transparent;cursor:pointer;width:100%;letter-spacing:3px;" onclick="startGame()">▶ CATCH!</button>
    </div>
  </div>

  <div id="screen-game" class="game-screen hidden">
    <div class="cd-wrap">
      <div class="cd-info">
        <div class="cd-stat">SCORE: <span id="cd-score">0</span></div>
        <div class="cd-stat">MISSED: <span id="cd-missed">0</span>/5</div>
        <div class="cd-stat">LEVEL: <span id="cd-level">1</span></div>
      </div>
      <canvas id="cd-canvas" width="520" height="400"></canvas>
      <div class="cd-hint">MOUSE / TOUCH TO MOVE BUCKET</div>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden">
    <div class="card" style="max-width:400px;margin:40px auto;padding:30px;text-align:center;">
      <h2 style="font-family:'Press Start 2P',monospace;font-size:16px;color:#ff4444;text-shadow:0 0 15px #ff4444;margin-bottom:16px;">BUCKET EMPTY!</h2>
      <div style="display:flex;gap:20px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;">
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#ffff00;text-shadow:0 0 12px #ffff00;display:block;" id="final-cd-score">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">SCORE</span></div>
        <div style="text-align:center;"><span style="font-family:'Press Start 2P',monospace;font-size:22px;color:#00ff88;text-shadow:0 0 12px #00ff88;display:block;" id="final-cd-best">0</span><span style="font-family:'Press Start 2P',monospace;font-size:7px;color:#555;">BEST</span></div>
      </div>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px;border:2px solid #00ff88;color:#00ff88;background:transparent;cursor:pointer;width:100%;margin-bottom:8px;" onclick="startGame()">▶ CATCH AGAIN</button>
      <button style="font-family:'Press Start 2P',monospace;font-size:10px;padding:14px;border:2px solid #555;color:#555;background:transparent;cursor:pointer;width:100%;" onclick="PH.showScreen('screen-start')">MENU</button>
    </div>
  </div>
</div>
<audio id="bg-music" loop><source src="../assets/music/arcade.mp3" type="audio/mpeg"></audio>
<audio id="sfx-click" src="../assets/sounds/click.mp3" preload="auto"></audio>
<audio id="sfx-win" src="../assets/sounds/win.mp3" preload="auto"></audio>
<audio id="sfx-lose" src="../assets/sounds/lose.mp3" preload="auto"></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>
<script>
(function(){
  'use strict';
  const W=520,H=400,BWIDTH=70,BHEIGHT=24;
  let drops,bucket,score,missed,level,raf,caught,particles,frame;
  const DROP_COLORS=['#00ffff','#00ff88','#0088ff','#ff00ff','#ff6600'];

  function newDrop(){
    const gold=Math.random()<0.08;
    return {
      x:20+Math.random()*(W-40), y:-20,
      r:gold?14:8+Math.random()*8,
      vy:1.5+level*0.4+Math.random()*1.5,
      color:gold?'#ffd700':DROP_COLORS[Math.floor(Math.random()*DROP_COLORS.length)],
      gold, pts:gold?30:10, alive:true
    };
  }

  function draw(){
    const canvas=document.getElementById('cd-canvas');
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#080018'; ctx.fillRect(0,0,W,H);
    // rain lines
    for(let i=0;i<6;i++){
      const lx=((frame*2+i*100)%W+W)%W;
      ctx.strokeStyle='rgba(0,255,136,0.04)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx-40,H); ctx.stroke();
    }
    // particles
    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--;
      if(p.life>0){ ctx.fillStyle=p.color; ctx.globalAlpha=p.life/p.ml; ctx.fillRect(p.x,p.y,4,4); ctx.globalAlpha=1; }
    });
    particles=particles.filter(p=>p.life>0);
    // drops
    drops.forEach(d=>{
      ctx.shadowBlur=12; ctx.shadowColor=d.color;
      ctx.fillStyle=d.color;
      ctx.beginPath();
      ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fill();
      if(d.gold){ ctx.fillStyle='#000'; ctx.font='bold 10px serif'; ctx.textAlign='center'; ctx.fillText('$',d.x,d.y+4); }
      ctx.shadowBlur=0;
    });
    // bucket
    const bx=bucket.x-BWIDTH/2;
    ctx.shadowBlur=15; ctx.shadowColor='#00ff88';
    ctx.strokeStyle='#00ff88'; ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(bx,H-BHEIGHT-20);
    ctx.lineTo(bx+8,H-20);
    ctx.lineTo(bx+BWIDTH-8,H-20);
    ctx.lineTo(bx+BWIDTH,H-BHEIGHT-20);
    ctx.stroke();
    ctx.fillStyle='rgba(0,255,136,0.15)';
    ctx.fill();
    ctx.shadowBlur=0;
    // cursor dot
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bucket.x,H-20,4,0,Math.PI*2); ctx.fill();
  }

  function update(){
    frame++;
    if(Math.random()<0.02+level*0.005) drops.push(newDrop());
    drops.forEach(d=>{
      d.y+=d.vy;
      // catch check
      if(d.y+d.r>H-BHEIGHT-20&&d.y<H-20&&Math.abs(d.x-bucket.x)<BWIDTH/2+d.r){
        d.alive=false; score+=d.pts; caught++;
        document.getElementById('cd-score').textContent=score;
        for(let i=0;i<10;i++) particles.push({x:d.x,y:d.y,vx:(Math.random()-0.5)*6,vy:-3-Math.random()*4,life:20,ml:20,color:d.color});
        if(caught%15===0){ level++; document.getElementById('cd-level').textContent=level; }
        if(typeof PH!=='undefined'&&d.gold&&PH.playWin) PH.playWin();
        return;
      }
      if(d.y>H+10){ d.alive=false; missed++; document.getElementById('cd-missed').textContent=missed;
        if(missed>=5){ endGame(); return; }
        if(typeof PH!=='undefined'&&PH.playLose) PH.playLose();
      }
    });
    drops=drops.filter(d=>d.alive);
    if(!gameOver) raf=requestAnimationFrame(()=>{draw();update();});
  }

  let gameOver=false;
  function endGame(){
    gameOver=true; cancelAnimationFrame(raf);
    const best=Math.max(score,parseInt(localStorage.getItem('cd_best')||'0'));
    localStorage.setItem('cd_best',best);
    document.getElementById('final-cd-score').textContent=score;
    document.getElementById('final-cd-best').textContent=best;
    if(typeof PH!=='undefined'){ PH.submitScore('catch-drop',score); PH.showScreen('screen-end'); }
  }

  function setupInput(){
    const canvas=document.getElementById('cd-canvas');
    canvas.addEventListener('mousemove',e=>{
      const rect=canvas.getBoundingClientRect();
      bucket.x=Math.max(BWIDTH/2,Math.min(W-BWIDTH/2,e.clientX-rect.left));
    });
    canvas.addEventListener('touchmove',e=>{
      e.preventDefault();
      const rect=canvas.getBoundingClientRect();
      bucket.x=Math.max(BWIDTH/2,Math.min(W-BWIDTH/2,e.touches[0].clientX-rect.left));
    },{passive:false});
  }

  window.startGame=function(){
    drops=[]; score=0; missed=0; level=1; caught=0; particles=[]; frame=0; gameOver=false;
    bucket={x:W/2};
    cancelAnimationFrame(raf);
    const best=localStorage.getItem('cd_best')||0;
    document.getElementById('cd-score').textContent=0;
    document.getElementById('cd-missed').textContent=0;
    document.getElementById('cd-level').textContent=1;
    document.getElementById('best-cd').textContent=best;
    if(typeof PH!=='undefined') PH.showScreen('screen-game');
    setupInput(); update();
  };

  document.getElementById('best-cd').textContent=localStorage.getItem('cd_best')||0;
  if(typeof PH!=='undefined') PH.initGamePage();
})();
</script>
</body>
</html>
