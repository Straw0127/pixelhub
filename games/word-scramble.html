<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Scramble - PixelHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .ws-wrap { display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px; max-width:560px; margin:0 auto; width:100%; }
    .scrambled-word { font-family:'Press Start 2P',monospace; font-size:clamp(20px,5vw,40px); color:#ff00ff; text-shadow:0 0 20px #ff00ff; letter-spacing:8px; text-align:center; padding:20px; border:2px solid rgba(255,0,255,0.3); background:rgba(20,0,30,0.8); min-height:80px; display:flex; align-items:center; justify-content:center; width:100%; }
    .hint-text { font-size:11px; color:#aac; font-family:'Press Start 2P',monospace; letter-spacing:2px; text-align:center; }
    .ws-input { background:#080015; border:2px solid rgba(255,0,255,0.4); color:#ff00ff; font-family:'Press Start 2P',monospace; font-size:clamp(14px,3vw,20px); padding:14px 20px; text-align:center; width:100%; letter-spacing:4px; outline:none; text-transform:uppercase; transition:all 0.2s; }
    .ws-input:focus { border-color:#ff00ff; box-shadow:0 0 15px rgba(255,0,255,0.3); }
    .ws-input.correct { border-color:#00ff88; box-shadow:0 0 20px rgba(0,255,136,0.4); color:#00ff88; }
    .ws-input.wrong { border-color:#ff4444; box-shadow:0 0 15px rgba(255,68,68,0.4); animation:shake2 0.3s ease; }
    @keyframes shake2 { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    .letter-tiles { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
    .letter-tile { width:44px; height:44px; background:#1a0030; border:2px solid rgba(255,0,255,0.4); display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P',monospace; font-size:16px; color:#ff00ff; cursor:pointer; transition:all 0.15s; user-select:none; }
    .letter-tile:hover { border-color:#ff00ff; background:#2a0040; transform:translateY(-3px); box-shadow:0 4px 15px rgba(255,0,255,0.3); }
    .letter-tile.used { opacity:0.3; cursor:default; transform:none; }
    .answer-slots { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-height:52px; }
    .answer-slot { width:44px; height:44px; border-bottom:3px solid rgba(255,0,255,0.4); display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P',monospace; font-size:16px; color:#fff; cursor:pointer; transition:all 0.2s; }
    .answer-slot.filled { border-bottom-color:#ff00ff; color:#ff00ff; }
    .progress-bar-wrap { width:100%; height:8px; background:rgba(255,0,255,0.15); border:1px solid rgba(255,0,255,0.3); }
    .progress-bar-fill { height:100%; background:linear-gradient(90deg,#ff00ff,#00ffff); box-shadow:0 0 8px #ff00ff; transition:width 0.5s ease; }
    .ws-stats { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
    .ws-stat { font-family:'Press Start 2P',monospace; font-size:10px; text-align:center; }
    .ws-stat-num { display:block; font-size:22px; }
  </style>
</head>
<body data-game="word-scramble">
<div id="pixel-bg"><div class="grid-overlay"></div><div class="scanlines"></div></div>
<div id="app" class="game-page">
  <nav class="game-nav">
    <a href="../index.html" class="back-btn">← BACK</a>
    <span class="game-title-nav">🔤 WORD SCRAMBLE</span>
    <span class="score-display">BEST: <span id="nav-best">0</span></span>
  </nav>

  <div id="screen-start" class="game-screen" style="position:relative;max-width:440px;margin:40px auto;">
    <h1>🔤 WORD SCRAMBLE</h1>
    <p>Unscramble the letters to form the correct word. You have 10 words per round!</p>
    <div style="margin:16px 0;font-family:'Press Start 2P',monospace;font-size:9px;color:#aac;">
      HIGH SCORE: <span class="neon-magenta" id="best-display">0</span>
    </div>
    <button class="pixel-btn btn-magenta" onclick="startGame()"><span class="btn-span">▶ START GAME</span></button>
  </div>

  <div id="screen-game" class="hidden">
    <div class="ws-wrap">
      <div class="ws-stats">
        <div class="ws-stat"><span class="ws-stat-num neon-magenta" id="score-disp">0</span><span style="color:#aac">SCORE</span></div>
        <div class="ws-stat"><span class="ws-stat-num neon-yellow" id="word-num">1</span><span style="color:#aac">WORD</span></div>
        <div class="ws-stat"><span class="ws-stat-num neon-cyan" id="timer-disp">30</span><span style="color:#aac">SECS</span></div>
        <div class="ws-stat"><span class="ws-stat-num neon-green" id="streak-disp">0</span><span style="color:#aac">STREAK</span></div>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prog-bar" style="width:100%"></div></div>
      <div class="scrambled-word" id="scrambled-display">LOADING...</div>
      <div class="hint-text" id="hint-text">HINT: ???</div>
      <div class="answer-slots" id="answer-slots"></div>
      <div class="letter-tiles" id="letter-tiles"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
        <button class="pixel-btn btn-magenta" onclick="checkAnswer()"><span class="btn-span">✓ CHECK</span></button>
        <button class="pixel-btn btn-cyan" onclick="clearAnswer()"><span class="btn-span">✗ CLEAR</span></button>
        <button class="pixel-btn btn-yellow" onclick="skipWord()"><span class="btn-span">» SKIP</span></button>
      </div>
      <div style="font-size:11px;color:#aac;font-family:'Press Start 2P',monospace;letter-spacing:1px;" id="feedback-text"></div>
    </div>
  </div>

  <div id="screen-end" class="game-screen hidden" style="position:relative;max-width:440px;margin:40px auto;">
    <h1>🎯 ROUND OVER!</h1>
    <span class="final-score" id="end-score">0</span>
    <p id="end-msg"></p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
      <button class="pixel-btn btn-magenta" onclick="startGame()"><span class="btn-span">▶ PLAY AGAIN</span></button>
      <a href="../index.html" class="pixel-btn btn-cyan"><span class="btn-span">◀ MENU</span></a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/games.js"></script>
<script src="../js/main.js"></script>

<script>
const WORDS=[
  {word:'PIXEL',hint:'Tiny screen dot'},
  {word:'ARCADE',hint:'Gaming venue'},
  {word:'NEON',hint:'Glowing light'},
  {word:'JOYSTICK',hint:'Game controller'},
  {word:'RETRO',hint:'Old school style'},
  {word:'SPACESHIP',hint:'Travels through stars'},
  {word:'DRAGON',hint:'Fire-breathing beast'},
  {word:'WIZARD',hint:'Casts magic spells'},
  {word:'TROPHY',hint:'Prize for winning'},
  {word:'GALAXY',hint:'Star system'},
  {word:'MONSTER',hint:'Scary creature'},
  {word:'CASTLE',hint:'Fortified structure'},
  {word:'CRYSTAL',hint:'Gem-like mineral'},
  {word:'THUNDER',hint:'Storm sound'},
  {word:'PORTAL',hint:'Magic doorway'},
  {word:'SHIELD',hint:'Defensive armor'},
  {word:'POTION',hint:'Magic liquid'},
  {word:'DUNGEON',hint:'Underground prison'},
  {word:'ARTIFACT',hint:'Ancient relic'},
  {word:'PHANTOM',hint:'Ghost-like being'},
  {word:'VORTEX',hint:'Spinning force'},
  {word:'CYBORG',hint:'Half human half machine'},
  {word:'LABYRINTH',hint:'Complex maze'},
  {word:'QUANTUM',hint:'Tiny physics unit'},
  {word:'NEBULA',hint:'Space cloud'},
];

let wordList, currentWord, scrambled, answer=[], letterUsed=[], score=0, streak=0, wordIdx=0, timer, timeLeft=30;

function startGame(){
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-end').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');
  score=0; streak=0; wordIdx=0;
  wordList=PH.shuffle(WORDS).slice(0,10);
  loadWord();
}

function loadWord(){
  clearInterval(timer);
  if(wordIdx>=wordList.length){ endGame(); return; }
  const {word,hint}=wordList[wordIdx];
  currentWord=word;
  scrambled=scrambleWord(word);
  answer=[];
  letterUsed=scrambled.split('').map(()=>false);
  timeLeft=Math.max(15,30-wordIdx*2);
  document.getElementById('word-num').textContent=(wordIdx+1)+'/'+wordList.length;
  document.getElementById('hint-text').textContent='HINT: '+hint;
  document.getElementById('feedback-text').textContent='';
  document.getElementById('scrambled-display').textContent=scrambled;
  renderSlots();
  renderTiles();
  updateStats();
  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById('timer-disp').textContent=timeLeft;
    document.getElementById('prog-bar').style.width=(timeLeft/30*100)+'%';
    if(timeLeft<=5) document.getElementById('timer-disp').style.color='#ff4444';
    if(timeLeft<=0){ clearInterval(timer); skipWord(true); }
  },1000);
}

function scrambleWord(word){
  let s=word;
  while(s===word||s.split('').every((c,i)=>c===word[i])){
    s=PH.shuffle(word.split('')).join('');
  }
  return s;
}

function renderSlots(){
  const el=document.getElementById('answer-slots');
  el.innerHTML='';
  for(let i=0;i<currentWord.length;i++){
    const slot=document.createElement('div');
    slot.className='answer-slot'+(answer[i]?' filled':'');
    slot.textContent=answer[i]||'';
    slot.dataset.i=i;
    slot.addEventListener('click',()=>removeFromSlot(i));
    el.appendChild(slot);
  }
}

function renderTiles(){
  const el=document.getElementById('letter-tiles');
  el.innerHTML='';
  scrambled.split('').forEach((letter,i)=>{
    const tile=document.createElement('div');
    tile.className='letter-tile'+(letterUsed[i]?' used':'');
    tile.textContent=letter;
    tile.addEventListener('click',()=>addLetter(i,letter));
    el.appendChild(tile);
  });
}

function addLetter(tileIdx,letter){
  if(letterUsed[tileIdx]) return;
  const slot=answer.findIndex(a=>a===undefined||a===null);
  const nextEmpty=findNextEmpty();
  if(nextEmpty===-1) return;
  answer[nextEmpty]=letter;
  letterUsed[tileIdx]=true;
  PH.playBeep&&PH.playBeep(660,0.05,'sine',0.08);
  renderSlots(); renderTiles();
  if(answer.filter(a=>a).length===currentWord.length) checkAnswer();
}

function findNextEmpty(){
  for(let i=0;i<currentWord.length;i++) if(!answer[i]) return i;
  return -1;
}

function removeFromSlot(i){
  if(!answer[i]) return;
  // Find the tile that matches
  const letter=answer[i];
  const tileIdx=letterUsed.findIndex((used,ti)=>used&&scrambled[ti]===letter&&
    answer.filter((a,ai)=>ai<i&&a===letter).length<=letterUsed.filter((u,ti2)=>u&&ti2<ti&&scrambled[ti2]===letter).length);
  if(tileIdx>=0) letterUsed[tileIdx]=false;
  answer[i]=null;
  renderSlots(); renderTiles();
}

function clearAnswer(){
  answer=Array(currentWord.length).fill(null);
  letterUsed=letterUsed.map(()=>false);
  renderSlots(); renderTiles();
  PH.playClick&&PH.playClick();
}

function checkAnswer(){
  const typed=answer.join('');
  if(typed.length<currentWord.length) return;
  if(typed===currentWord){
    const pts=100+streak*20+timeLeft*5;
    score+=pts; streak++;
    document.getElementById('feedback-text').textContent='✓ CORRECT! +'+pts;
    document.getElementById('feedback-text').style.color='#00ff88';
    PH.playWin&&PH.playWin();
    clearInterval(timer);
    wordIdx++;
    updateStats();
    setTimeout(loadWord,1000);
  } else {
    streak=0;
    document.getElementById('feedback-text').textContent='✗ WRONG! TRY AGAIN!';
    document.getElementById('feedback-text').style.color='#ff4444';
    PH.playError&&PH.playError();
    document.getElementById('scrambled-display').classList.add('wrong');
    setTimeout(()=>document.getElementById('scrambled-display').classList.remove('wrong'),300);
    clearAnswer();
    updateStats();
  }
}

function skipWord(timeout=false){
  streak=0;
  clearInterval(timer);
  document.getElementById('feedback-text').textContent=timeout?'⏰ TIME UP! ANSWER: '+currentWord:'SKIPPED! ANSWER: '+currentWord;
  document.getElementById('feedback-text').style.color='#ff6600';
  PH.playBeep&&PH.playBeep(330,0.15,'sawtooth',0.1);
  wordIdx++;
  updateStats();
  setTimeout(loadWord,1200);
}

function updateStats(){
  document.getElementById('score-disp').textContent=score;
  document.getElementById('streak-disp').textContent=streak;
  document.getElementById('timer-disp').style.color=timeLeft>10?'#00ffff':'#ff4444';
}

function endGame(){
  clearInterval(timer);
  document.getElementById('screen-game').classList.add('hidden');
  document.getElementById('screen-end').classList.remove('hidden');
  document.getElementById('end-score').textContent=score+' PTS';
  const isNew=PH.setHighScore('word-scramble',score);
  document.getElementById('end-msg').textContent=`Completed all 10 words!${isNew?' 🏆 NEW HIGH SCORE!':''}`;
  document.getElementById('nav-best').textContent=PH.getHighScore('word-scramble');
  if(score>600) PH.confetti&&PH.confetti();
}

document.getElementById('best-display').textContent=PH.getHighScore('word-scramble');
document.getElementById('nav-best').textContent=PH.getHighScore('word-scramble');

// Keyboard input
document.addEventListener('keydown',e=>{
  if(document.getElementById('screen-game').classList.contains('hidden')) return;
  if(e.key==='Enter') checkAnswer();
  if(e.key==='Backspace'){ 
    // Remove last placed letter
    for(let i=answer.length-1;i>=0;i--){ if(answer[i]){ removeFromSlot(i); break; } }
  }
  if(e.key.length===1&&e.key.match(/[a-zA-Z]/)){
    const letter=e.key.toUpperCase();
    const tileIdx=scrambled.split('').findIndex((l,i)=>l===letter&&!letterUsed[i]);
    if(tileIdx>=0) addLetter(tileIdx,letter);
  }
});
</script>
</body>
</html>
